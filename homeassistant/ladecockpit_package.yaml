# Optionales Home-Assistant-Paket für Ladecockpit.
# Nach /config/packages/ladecockpit.yaml kopieren (Pakete müssen in configuration.yaml aktiviert sein:
#   homeassistant:
#     packages: !include_dir_named packages
# ), LADECOCKPIT_HOST ersetzen, die Konfiguration prüfen und neu starten oder neu laden.
#
# Für die Grundfunktionen brauchst du das NICHT: Ladecockpit liest die Entitäten deines Autos, erkennt
# das Ende einer Ladung und legt eigene Entitäten sensor.ladecockpit_* an. Nur nutzen, wenn du die
# Suche nach der Rechnung selbst auslösen willst.
#
# Ladecockpit < 0.3 hatte hier REST-Sensoren. Wer sie kopiert hat, entfernt sie: Sie würden mit den
# Entitäten kollidieren, die Ladecockpit jetzt selbst anlegt.

rest_command:
  # Optional: sofort nach der Rechnung suchen (z. B. aus einer eigenen Automation).
  ladecockpit_sync:
    url: "http://LADECOCKPIT_HOST:8077/api/sync"
    method: post
    timeout: 10
    # Nur, wenn APP_PASSWORD gesetzt ist:
    # username: ladecockpit
    # password: !secret ladecockpit_password
