services:
  ladecockpit:
    # Lokal aus diesem Repository bauen …
    build: .
    # … oder stattdessen das veröffentlichte Image nutzen ("build" oben entfernen):
    # image: ghcr.io/uekala/ladecockpit:latest
    container_name: ladecockpit
    restart: unless-stopped
    env_file: .env
    ports:
      - "8077:8077"
    volumes:
      - ladecockpit-data:/data

volumes:
  ladecockpit-data:
