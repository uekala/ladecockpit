[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: Zeilenlänge regelt der Formatierer. RUF001–003: deutsche Typografie ist gewollt.
# B008: Depends() in FastAPI-Signaturen ist so vorgesehen.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]
