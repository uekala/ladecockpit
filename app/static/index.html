  function batteryPanel(d) {
    if (dynamic()) return ringPanel(d);
    const s = d.status || {};
    const soc = s.soc;
    const floor = s.floor ?? 10, target = s.target ?? 80;
    const fillCls = soc == null ? "" : soc <= floor ? "bad" : soc <= floor + 8 ? "warn" : "";
    const stamp = soc == null
      ? `<span class="chip bad">${T("noBattery")}</span>`
      : s.charging
        ? `<span class="chip good pulse">${T("chargingNow")}${s.power ? " · " + num(s.power, 0) + " kW" : ""}</span>${s.finish ? `<span>${esc(T("chargeAt", { t: target, time: tShort(s.finish) }))}</span>` : ""}`
      : s.soc_source === "live"
        ? `<span class="chip good">${T("carOnline")}</span><span>${T("liveFromHa")}</span>`
        : `<span class="chip">${T("carOffline")}</span><span>${esc(T("lastValue", { when: relTime(s.as_of) }))}</span>`;
    const socTxt = soc == null ? T("unknown") : num(soc, 0) + " %";
    return `<div class="battery">
      <div class="battery-head">
        <div class="big" id="h-batt" aria-label="${esc(T("battery") + " " + socTxt)}">${soc == null ? "–" : num(soc, 0)}<small>%</small></div>
        <div class="range">${s.range == null ? "–" : "≈ " + num(s.range, 0) + " " + unit()}<small>${T("rangeLabel")}</small></div>
      </div>
      <div class="gauge" role="img" aria-label="${esc(T("gaugeAria", { soc: socTxt, a: floor, b: target }))}">
        <div class="gauge-body">
          <div class="gauge-track">
            <div class="gauge-fill ${fillCls}" style="width:${Math.max(0, Math.min(100, soc ?? 0))}%"></div>
            <div class="gauge-floor" style="left:${floor}%"></div>
            <div class="gauge-limit" style="left:${target}%"></div>
          </div>
        </div>
        <div class="gauge-scale">
          <span style="left:0">0</span><span style="left:${floor}%">${floor}</span><span style="left:${target}%">${target}</span><span style="left:100%">100 %</span>
        </div>
      </div>
      <div class="stamp">${stamp}<span>${esc(T("windowText", { a: floor, b: target }))}</span></div>
    </div>`;
  }

  // --- Battery ring (dynamic look) ------------------------------------------------------------------
  // 270° from bottom left to bottom right, like a gauge in the car: ticks every 5 %, the floor and
  // the charge limit marked outside, the level as a lit arc. While charging, energy runs along it.
  const RING = { cx: 120, cy: 120, r: 92, from: 135, sweep: 270 };
  const ringPt = (p, r = RING.r) => {
    const a = ((RING.from + (RING.sweep * Math.max(0, Math.min(100, p))) / 100) * Math.PI) / 180;
    return [+(RING.cx + r * Math.cos(a)).toFixed(2), +(RING.cy + r * Math.sin(a)).toFixed(2)];
  };
  const ringArc = (p0, p1, r = RING.r) => {
    const [x0, y0] = ringPt(p0, r), [x1, y1] = ringPt(p1, r);
    return `M${x0} ${y0}A${r} ${r} 0 ${(RING.sweep * (p1 - p0)) / 100 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
  };

  function ringPanel(d) {
    const s = d.status || {};
    const soc = s.soc;
    const floor = s.floor ?? 10, target = s.target ?? 80;
    const socTxt = soc == null ? T("unknown") : num(soc, 0) + " %";
    const p = Math.max(0, Math.min(100, soc ?? 0));
    const ticks = [];
    for (let t = 0; t <= 100; t += 5) {
      const major = t % 25 === 0;
      const [x0, y0] = ringPt(t, 104), [x1, y1] = ringPt(t, major ? 113 : 109);
      ticks.push(`<line class="tick${major ? " major" : ""}${soc != null && t <= soc ? " lit" : ""}" style="--t:${t / 5}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`);
    }
    const mark = (v) => {
      const [x0, y0] = ringPt(v, 83), [x1, y1] = ringPt(v, 101), [lx, ly] = ringPt(v, 124);
      return `<line class="mark" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/><text class="mark-label" x="${lx}" y="${ly}">${v}</text>`;
    };
    const state = soc == null ? `<span class="ring-state">${T("noBattery")}</span>`
      : s.charging ? `<span class="ring-state">${ico.bolt}${T("chargingNow")}</span>`
      : `<span class="ring-state">${T(s.soc_source === "live" ? "carOnline" : "carOffline")}</span>`;
    const facts = [];
    if (s.charging) {
      if (s.power) facts.push(`<span><small>${T("chargePower")}</small>${num(s.power, 0)} kW</span>`);
      if (s.finish) {
        facts.push(`<span><small>${esc(T("chargeLimit", { t: target }))}</small>${esc(tShort(s.finish))}</span>`);
        facts.push(`<span><small>${T("chargeLeft")}</small><b data-until="${esc(s.finish)}">${untilText(s.finish)}</b></span>`);
      }
      if (s.rate && facts.length < 3) facts.push(`<span>${esc(T("chargeRate", { r: num(s.rate, 0) }))}</span>`);
    }
    const stamp = s.charging ? "" : soc == null ? ""
      : s.soc_source === "live" ? `<span>${T("liveFromHa")}</span>` : `<span>${esc(T("lastValue", { when: relTime(s.as_of) }))}</span>`;
    return `<div class="battery dyn-battery">
      <div class="ring" role="img" aria-label="${esc(T("gaugeAria", { soc: socTxt, a: floor, b: target }))}">
        <svg viewBox="-16 -16 272 272" aria-hidden="true">
          <defs><linearGradient id="ring-grad" gradientUnits="userSpaceOnUse" x1="40" y1="220" x2="220" y2="40">
            <stop offset="0" class="ring-stop from"/><stop offset="1" class="ring-stop"/>
          </linearGradient></defs>
          ${ticks.join("")}
          <path class="ring-track" d="${ringArc(0, 100)}"/>
          ${soc != null && p > 0 ? `<path class="ring-fill" d="${ringArc(0, Math.max(p, 0.5))}" pathLength="1"/>` : ""}
          ${s.charging && p > 2 ? `<path class="ring-flow" d="${ringArc(0, p)}" pathLength="1"/>` : ""}
          ${mark(floor)}${mark(target)}
        </svg>
        <div class="ring-center">
          <div class="big" id="h-batt">${soc == null ? "–" : num(soc, 0)}<small>%</small></div>
          ${s.range == null ? "" : `<div class="ring-range">≈ ${num(s.range, 0)} ${unit()}</div>`}
          ${state}
        </div>
      </div>
      ${facts.length ? `<div class="charge-facts">${facts.join("")}</div>` : ""}
      <div class="stamp">${stamp}<span>${esc(T("windowText", { a: floor, b: target }))}</span></div>
    </div>`;
  }

  // Time left until a moment, as 18:42 or 1:05:30, ticking every second while it is on the page
  function untilText(iso) {
    const sec = Math.round(Math.max(0, new Date(iso).getTime() - Date.now()) / 1000);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = String(sec % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
  }
  setInterval(() => document.querySelectorAll("[data-until]").forEach((el) => (el.textContent = untilText(el.dataset.until))), 1000);

  function nextStopPanel(d) {
    const f = d.forecast || {};
    const slotTip = (d.insights || []).find((i) => i.kind === "slot");
    const floor = d.status?.floor ?? 10;
    const days = f.calendar_days;
    const subline = days == null ? (f.text || "")
      : days <= 0 ? T("reachesToday", { floor })
      : days === 1 ? T("reachesTomorrow", { floor })
      : T("reachesIn", { days: num(days, 0), floor });
    return `<section class="panel" aria-labelledby="h-next">
      <span class="eyebrow" id="h-next">${T("nextStop")}</span>
      <div>
        <div class="next-date">${f.date_label ? esc(f.date_label) : "–"}</div>
        <p class="sub" style="margin-top:6px">${esc(subline)}</p>
      </div>
      ${days != null && days < 2 ? `<span class="chip warn" style="justify-self:start">${T("soon")}</span>` : ""}
      <div class="facts">
        <div class="fact"><b>${f.rate_pct_day == null ? "–" : num(f.rate_pct_day, 1) + " %"}</b><span>${T("perDay")}</span></div>
        <div class="fact"><b>${f.dist_day == null ? "–" : num(f.dist_day, 0) + " " + unit()}</b><span>${T("distPerDay")}</span></div>
        <div class="fact"><b>${f.basis_days ? T("days", { n: num(f.basis_days, 0) }) : "–"}</b><span>${T("basis")}</span></div>
      </div>
      ${f.plan ? `<div class="tip">${ico.bolt}<span>${esc(f.plan.text)}</span></div>`
        : slotTip ? `<div class="tip">${ico.clock}<span>${esc(slotTip.text)}</span></div>` : ""}
    </section>`;
  }

  const pushChip = (st) => ({
    pushed: `<span class="chip good">${T("pushed")}</span>`,
    backfill: `<span class="chip plain">${T("backfill")}</span>`,
    new: `<span class="chip info">${T("pending")}</span>`,
    stale: `<span class="chip warn">${T("stale")}</span>`,
  }[st] || "");
  const pushChipShort = (st) => ({
    pushed: `<span class="chip good">${T("pushedShort")}</span>`,
    backfill: `<span class="chip plain">${T("backfillShort")}</span>`,
    new: `<span class="chip info">${T("pendingShort")}</span>`,
    stale: `<span class="chip warn">${T("staleShort")}</span>`,
  }[st] || "");

  function receiptPanel(d) {
    const c = d.last_charge;
    if (!c) return `<section class="panel"><span class="eyebrow">${T("lastCharge")}</span><p class="sub">${T("noCharge")}</p></section>`;
    const canPdf = c.has_invoice && !offline();
    const dur = c.duration_min != null ? ` (${c.duration_min} min)` : "";
    const line = (lbl, val, cls = "") => `<div class="line ${cls}"><span class="lbl">${lbl}</span><span class="dots"></span><span class="val">${val}</span></div>`;
    return `<section class="panel" aria-labelledby="h-last">
      <span class="eyebrow" id="h-last">${T("lastCharge")}</span>
      <div class="receipt">
        <div class="site">${esc(T(isMp(c) ? "multipass" : "supercharger", { site: c.site }))}</div>
        <div class="when">${esc(dShort(c.start))} · ${esc(tShort(c.start))}–${esc(tShort(c.end))}${dur}</div>
        ${line(T("energy"), num(c.kwh, 1) + " kWh")}
        ${line(T("price"), ppk(c.price))}
        ${c.credit ? line(T("listPrice"), ppk(c.list_price)) : ""}
        ${c.avg_kw ? line(T("power"), num(c.avg_kw, 0) + " kW", c.slow ? "slow" : "") : ""}
        ${c.avg_kw && c.slow ? `<div class="line-note">${esc(T("slowNote", { typical: num(c.typical_kw, 0) }))}</div>` : ""}
        ${line(T("charging"), money(c.charge_cost))}
        ${c.credit ? line(T("credit"), "−" + money(c.credit)) : ""}
        ${line(T("idleFee"), money(c.idle), c.idle ? "" : "zero")}
        ${line(T("total"), money(c.cost), "total")}
      </div>
      <div class="receipt-actions">
        ${canPdf ? `<a class="btn" href="api/invoice/${encodeURIComponent(c.id)}" data-view="api/invoice/${encodeURIComponent(c.id)}" data-title="${esc(c.site + " · " + dShort(c.start))}" target="_blank" rel="noopener">${T("invoicePdf")}</a>` : `<span class="btn is-disabled" title="${T("notInPreview")}">${T("invoicePdf")}</span>`}
        ${pushChip(c.push_state)}
      </div>
    </section>`;
  }

  function monthPanel(d) {
    const m = d.month || {};
    const c = d.compare || {};
    const prev = m.prev || {};
    let delta = "";
    const cur = m.list_price ?? m.avg_price, before = prev.list_price ?? prev.avg_price;
    if (before && cur) {
      const diff = cur - before;
      delta = T("avgDelta", { sign: diff <= 0 ? "−" : "+", d: money(Math.abs(diff)), month: prev.label });
    } else if (prev.sessions) {
      delta = `${prev.label}: ${money(prev.cost)}`;
    }
    const line = (lbl, val) => `<div class="line"><span class="lbl">${lbl}</span><span class="dots"></span><span class="val">${val}</span></div>`;
    // Groups, most useful first: what the total is made of (only when there is more than one part),
    // the saving against a combustion car, the check against the price HA used to estimate with,
    // and the fuel of another car. A line separates the groups.
    const groups = [];
    const parts = [];
    if (m.home) {
      parts.push(line(esc(T("invoicesLine")), money(m.cost)));
      parts.push(line(esc(m.home.cost != null ? T("homeLine", { kwh: num(m.home.kwh, 1), p: money(m.home.avg_price) }) : T("homeLineNoPrice", { kwh: num(m.home.kwh, 1) })), money(m.home.cost)));
    }
    const mp = (m.by_network || {}).multipass;
    if (mp && mp.sessions && (m.by_network || {}).supercharger) parts.push(line(esc(T("ofWhichMp", { n: mp.sessions })), `${money(mp.cost)} · ${ppk(mp.avg_price)}`));
    if (m.credit) parts.push(line(T("creditsUsed"), money(m.credit)));
    if (m.idle) parts.push(line(T("idleFee"), money(m.idle)));
    groups.push(parts);
    const fuel = c.fuel;
    if (fuel && m.fuel_equivalent != null && m.savings != null) {
      // The distance can start after the first of the month (odometer readings begin later).
      const since = m.distance_since && m.key && m.distance_since.slice(0, 10) > m.key + "-01"
        ? T("fuelSince", { d: fmtDate(m.distance_since, { day: "2-digit", month: "2-digit" }) }) : "";
      groups.push([
        `<div class="cmp-head">${esc(T("fuelHead", { dist: num(m.distance, 0), unit: unit() }) + since)}</div>`,
        line(fuel.source === "paid"
          ? `<span tabindex="0" data-tip="${esc(T("fuelPaidTip", { litres: num(fuel.paid_litres, 0), span: fuel.paid_days ? T("fuelPaidDays", { n: fuel.paid_days }) : T("fuelPaidAll") }))}">${esc(T("fuelComparePaid", { c: num(fuel.consumption, 1), p: money(fuel.price, 3) }))}</span>`
          : esc(T("fuelCompare", { c: num(fuel.consumption, 1), p: money(fuel.price, 3) })), money(m.fuel_equivalent)),
        // Shown as the difference, so the three lines add up exactly.
        line(esc(T("teslaSame", { p: money(m.per_100), unit: unit() })), money(m.fuel_equivalent - m.savings)),
        `<div class="line"><span class="lbl">${T("saved")}</span><span class="dots"></span><span class="val" style="color:var(${m.savings >= 0 ? "--good" : "--bad"})">${money(m.savings)}</span></div>`,
      ]);
    }
    if (c.reference_cost != null) {
      const ref = [line(esc(T("atReference", { p: ppk(c.reference_price) })), money(c.reference_cost))];
      if (c.actual_cost != null) ref.push(line(T("perInvoices"), money(c.actual_cost)));
      groups.push(ref);
    }
    if (c.fuel_month != null) groups.push([line(esc(c.fuel_label), money(c.fuel_month))]);
    const cmp = groups.filter((g) => g.length).map((g, i) => (i ? `<div class="cmp-group">${g.join("")}</div>` : g.join("")));
    return `<section class="panel month" aria-labelledby="h-month">
      <div class="month-main">
      <span class="eyebrow" id="h-month">${esc(m.label || T("thisMonth"))} · ${esc(sessionsText(m.sessions || 0))}</span>
      <div class="month-total"><div class="big">${money(m.home ? m.total_cost : m.cost)}</div><span class="delta">${esc(delta)}</span></div>
      <div class="kpis">
        <div class="kpi"><b>${num(m.kwh, 1)}</b><span>${T("kwhCharged")}</span></div>
        <div class="kpi"><b>${m.avg_price == null ? "–" : money(m.avg_price)}</b><span>${T("avgPerKwh")}</span></div>
        <div class="kpi"><b>${m.per_100 == null ? "–" : money(m.per_100)}</b><span>${T("per100", { unit: unit() })}</span></div>
        <div class="kpi"><b>${m.kwh_per_100 == null ? "–" : num(m.kwh_per_100, 1)}</b><span>${T("kwh100", { unit: unit() })}</span></div>
      </div>
      </div>
      ${cmp.length ? `<div class="compare">${cmp.join("")}</div>` : ""}
    </section>`;
  }

  function radarPanel(d) {
    const slots = d.slots || [];
    const avg = d.totals?.list_price ?? d.totals?.avg_price;
    const priced = slots.filter((s) => s.avg_price != null);
    const maxP = Math.max(0.6, ...priced.map((s) => s.avg_price));
    const step = maxP > 1.2 ? 0.5 : 0.2;
    const top = Math.ceil(maxP / step) * step;
    const pct = (v) => (v / top) * 100;
    const best = priced.length >= 2 ? priced.reduce((a, b) => (b.avg_price < a.avg_price ? b : a)) : null;
    const ticks = [];
    for (let t = 0; t <= top + 1e-9; t += step) ticks.push(t);
    const rows = slots.map((s) => {
      const has = s.avg_price != null;
      const isBest = best && s.id === best.id;
      const tip = has
        ? T("tipSlot", { label: s.label, range: s.range, p: money(s.avg_price), n: sessionsText(s.sessions), kwh: num(s.kwh, 1) })
        : T("tipEmpty", { label: s.label });
      if (dynamic()) {
        // Tap for the details instead of a tooltip; the slot of right now is marked.
        const now = isNowSlot(s.id, d.tz);
        const diff = has && avg ? s.avg_price - avg : null;
        const vs = diff == null ? "" : Math.abs(diff) < 0.005 ? T("atAvg") : T(diff > 0 ? "aboveAvg" : "belowAvg", { d: money(Math.abs(diff)) });
        const more = has ? [sessionsText(s.sessions), num(s.kwh, 1) + " kWh", vs].filter(Boolean).join(" · ") : T("tipEmpty", { label: s.label });
        return `<div class="radar-row ${isBest ? "best" : ""} ${now ? "now" : ""} ${dyn.openSlots.has(s.id) ? "open" : ""}" data-slot="${esc(s.id)}" data-tone="${has ? tone(s.avg_price, avg) : ""}" tabindex="0" role="button" aria-expanded="${dyn.openSlots.has(s.id)}">
        <div class="who"><b>${esc(s.label)}${now ? `<span class="now-pill">${T("nowSlot")}</span>` : ""}</b><span>${esc(s.range)}</span></div>
        <div class="radar-track">
          ${has ? `<div class="radar-bar" style="width:${pct(s.avg_price)}%"></div>` : '<div class="radar-empty"></div>'}
          ${avg ? `<div class="radar-avg" style="left:${pct(avg)}%"></div>` : ""}
        </div>
        <div class="radar-val">${has ? money(s.avg_price) : '<span class="muted">–</span>'}<small>${has ? (isBest ? T("cheapest") : sessionsText(s.sessions)) : T("noSession")}</small></div>
        <div class="radar-more">${esc(more)}</div>
      </div>`;
      }
      return `<div class="radar-row ${isBest ? "best" : ""}" data-tone="${has ? tone(s.avg_price, avg) : ""}" data-tip="${esc(tip)}" tabindex="0">
        <div class="who"><b>${esc(s.label)}</b><span>${esc(s.range)}</span></div>
        <div class="radar-track">
          ${has ? `<div class="radar-bar" style="width:${pct(s.avg_price)}%"></div>` : '<div class="radar-empty"></div>'}
          ${avg ? `<div class="radar-avg" style="left:${pct(avg)}%"></div>` : ""}
        </div>
        <div class="radar-val">${has ? money(s.avg_price) : '<span class="muted">–</span>'}<small>${has ? (isBest ? T("cheapest") : sessionsText(s.sessions)) : T("noSession")}</small></div>
      </div>`;
    }).join("");
    const insights = (d.insights || []).filter((i) => !["slot", "fuel", "climate"].includes(i.kind));
    return `<section class="panel" aria-labelledby="h-radar">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
        <div><span class="eyebrow">${T("radar")}</span><h2 id="h-radar">${T("radarTitle")}</h2></div>
        <span class="sub">${T("radarSub")}${avg ? " · " + esc(T("yourAvg", { p: money(avg) })) : ""}</span>
      </div>
      <div class="radar">
        ${rows}
        <div class="radar-axis" aria-hidden="true"><span></span><div class="ticks">${ticks.map((t) => `<span style="left:${pct(t)}%">${num(t, 1)}</span>`).join("")}</div><span class="sub" style="font-size:.72rem;text-align:right">/kWh</span></div>
      </div>
      ${avg ? `<div class="tone-legend"><span>${T("toneCheap")}</span><span class="scale" aria-hidden="true"></span><span>${T("toneDear")}</span></div>` : ""}
      ${insights.length ? `<ul class="insights">${insights.map((i) => `<li class="${esc(i.kind)}">${insightIcon[i.kind] || ico.bolt}<span>${esc(i.text)}</span></li>`).join("")}</ul>` : ""}
    </section>`;
  }

  function bandLabel(b) {
    if (b.from == null) return T("bandBelow", { hi: num(b.to, 0) });
    if (b.to == null) return T("bandAbove", { lo: num(b.from, 0) });
    return T("bandRange", { lo: num(b.from, 0), hi: num(b.to, 0) });
  }

  function sparkline(values) {
    if (values.length < 2) return "";
    const w = 260, h = 46, lo = Math.min(...values), hi = Math.max(...values), span = hi - lo || 1;
    const pts = values.map((v, i) => `${(i / (values.length - 1)) * w},${h - 4 - ((v - lo) / span) * (h - 8)}`).join(" ");
    const area = dynamic() ? `<defs><linearGradient id="spark-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><polygon class="spark-area" points="0,${h} ${pts} ${w},${h}"/>` : "";
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true" style="margin-top:10px">${area}<polyline class="spark-line" points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function healthPanel(d) {
    const h = d.battery_health;
    if (!h) return "";
    let delta = T("healthWait");
    if (h.change_pct != null) {
      delta = T("healthSince", { d: fmtDate(h.since + "T12:00:00Z", { day: "2-digit", month: "2-digit", year: "numeric" }), sign: h.change_pct > 0 ? "+" : h.change_pct < 0 ? "−" : "±", p: num(Math.abs(h.change_pct), 1) });
    }
    const line = (lbl, val) => `<div class="line"><span class="lbl">${lbl}</span><span class="dots"></span><span class="val">${val}</span></div>`;
    return `<section class="panel" aria-labelledby="h-health">
      <div><span class="eyebrow">${T("health")}</span><h2 id="h-health">${T("healthTitle")}</h2></div>
      <div class="month-total"><div class="big">${num(h.range_at_100, 0)} ${unit()}</div><span class="delta">${esc(delta)}</span></div>
      ${sparkline((h.weeks || []).map((w) => w.value))}
      <p class="sub">${esc(T("healthSub", { n: h.samples }))}</p>
      ${h.dc_share != null ? `<div class="compare">${line(esc(T("dcShare")), num(h.dc_share, 0) + " %")}</div>` : ""}
    </section>`;
  }

  function climatePanel(d) {
    const c = d.climate;
    if (!c) return "";
    const tip = (d.insights || []).find((i) => i.kind === "climate");
    return `<section class="panel" aria-labelledby="h-climate">
      <div><span class="eyebrow">${T("climate")}</span><h2 id="h-climate">${T("climateTitle")}</h2></div>
      <div class="scroll"><table>
        <thead><tr><th>${T("thTemp")}</th><th class="n">${T("thDays")}</th><th class="n">${unit()}</th><th class="n">${T("thPct", { unit: unit() })}</th><th class="n">${T("thKwh100", { unit: unit() })}</th></tr></thead>
        <tbody>${c.bands.map((b) => `<tr><td>${esc(bandLabel(b))}</td><td class="n">${b.days}</td><td class="n">${num(b.distance, 0)}</td><td class="n">${num(b.pct_per_100, 1)}</td><td class="n">${b.kwh_per_100 == null ? "–" : num(b.kwh_per_100, 1)}</td></tr>`).join("")}</tbody>
      </table></div>
      ${tip ? `<div class="tip">${ico.bolt}<span>${esc(tip.text)}</span></div>` : ""}
      <p class="sub">${T("climateSub")}</p>
    </section>`;
  }

  function sitesPanel(d) {
    const sites = d.sites || [];
    if (!sites.length) return `<section class="panel"><span class="eyebrow">${T("sites")}</span><p class="sub">${T("noSessions")}</p></section>`;
    const maxP = Math.max(...sites.map((s) => s.avg_price || 0)) || 1;
    return `<section class="panel" aria-labelledby="h-sites">
      <div><span class="eyebrow">${T("sites")}</span><h2 id="h-sites">${T("sitesTitle")}</h2></div>
      <div class="scroll"><table>
        <thead><tr><th>${siteHead(d)}</th><th class="n">${T("thSessions")}</th><th class="n">${T("thKwh")}</th><th class="n">${T("thAvg")}</th><th class="n">Ø ${T("thKw")}</th></tr></thead>
        <tbody>${sites.map((s) => `<tr>
          <td class="site">${esc(s.site)}${mpChip(s)}</td>
          <td class="n">${s.sessions}</td>
          <td class="n">${num(s.kwh, 1)}</td>
          <td class="n"><span class="minibar" aria-hidden="true"><i data-tone="${tone(s.avg_price, avgPrice(d))}" style="width:${((s.avg_price || 0) / maxP) * 100}%"></i></span>${s.avg_price == null ? "–" : money(s.avg_price)}</td>
          <td class="n">${s.avg_kw == null ? "–" : num(s.avg_kw, 0)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </section>`;
  }

  function multipassPanel(d) {
    const mp = d.multipass;
    const list = mp?.stations || [];
    if (!list.length) return "";
    const day = (iso) => fmtDate(iso, { day: "2-digit", month: "2-digit", year: "numeric" });
    const ops = (mp.operators || []).map((o) => `<span class="chip info" tabindex="0" data-tip="${esc(T("mpOpTip", { name: o.name, stations: stationsText(o.stations), sessions: sessionsText(o.sessions), d: day(o.last) }))}">${esc(o.name)} · ${esc(stationsText(o.stations))}</span>`);
    return `<section class="panel" aria-labelledby="h-mp">
      <div><span class="eyebrow">${T("mpChip")}</span><h2 id="h-mp">${T("mpTitle")}</h2>
        <p class="sub">${esc(T("mpSub"))} · ${esc(sessionsText(mp.sessions))}${mp.avg_price ? " · Ø " + ppk(mp.avg_price) : ""}</p></div>
      ${ops.length ? `<div class="op-chips">${ops.join("")}</div>` : ""}
      <ul class="mp-list">${list.map((s) => `<li>
        <div class="who"><b>${esc(s.site)}</b><span>${esc([s.operator, sessionsText(s.sessions)].filter(Boolean).join(" · "))}</span></div>
        <div class="mp-val">${s.avg_price == null ? "–" : ppk(s.avg_price)}<small>${esc(T("mpLast"))} ${day(s.last)}</small></div>
        <a class="map-link" href="${esc(s.map_url)}" target="_blank" rel="noopener noreferrer" title="${esc(T("mpMapTitle", { site: s.site }))}" aria-label="${esc(T("mpMapTitle", { site: s.site }))}">${ico.pin}<span>${T("mpMap")}</span></a>
      </li>`).join("")}</ul>
      <p class="sub">${T("mpNote")}</p>
    </section>`;
  }

  function projectionLine(d) {
    const p = d.projection;
    if (!p) return "";
    let s = T("projection", { cost: money(p.cost, 0), dist: num(p.distance, 0), unit: unit() });
    if (p.savings != null) s += T("projectionFuel", { fuel: money(p.fuel_cost, 0), saved: money(p.savings, 0) });
    s += T("projectionBasis", { n: p.basis_days });
    return `<p class="sub" style="margin-top:6px">${esc(s)}</p>`;
  }

  function historyPanel(d) {
    const months = d.monthly || [];
    const mc = (m) => (m.cost || 0) + (m.home_cost || 0);
    const max = Math.max(1, ...months.map(mc));
    const curKey = d.month?.key;
    const info = (m) => `${m.label}: ${money(m.cost)} · ${num(m.kwh, 1)} kWh · ${sessionsText(m.sessions)}${m.avg_price ? " · " + ppk(m.avg_price) : ""}${m.kwh_per_100 ? " · " + num(m.kwh_per_100, 1) + " kWh/100 " + unit() : ""}`;
    const sel = dynamic() ? months.find((m) => m.key === dyn.month) || months.find((m) => m.key === curKey) || months[months.length - 1] : null;
    return `<section class="panel" aria-labelledby="h-hist">
      <div><span class="eyebrow">${T("history")}</span><h2 id="h-hist">${T("historyTitle")}</h2>${projectionLine(d)}</div>
      ${sel ? `<div class="readout" id="readout" aria-live="polite">${readoutHtml(sel)}</div>` : ""}
      <div class="cols" role="img" aria-label="${T("perMonthAria")}">
        ${months.map((m) => `<div class="col ${m.key === curKey ? "cur" : ""} ${sel && sel.key === m.key ? "sel" : ""}" tabindex="0" data-month="${esc(m.key)}" ${sel ? "" : `data-tip="${esc(info(m))}"`}>
          <span class="v">${mc(m) ? money(mc(m), 0) : ""}</span>
          <div class="bar" style="height:${(mc(m) / max) * 100 * 0.82}%"></div>
        </div>`).join("")}
      </div>
      <div class="col-labels">${months.map((m) => `<span>${esc(m.label)}${m.key === curKey ? " " + T("current") : ""}</span>`).join("")}</div>
    </section>`;
  }

  function sessionsPanel(d) {
    const list = d.sessions || [];
    const t = d.totals || {};
    const fold = dynamic() && list.length > SESSIONS_FOLDED + 1;
    return `<section class="panel ${fold && dyn.allSessions ? "show-all" : ""}" aria-labelledby="h-list" id="sessions-panel">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
        <div><span class="eyebrow">${T("allSessions")}</span><h2 id="h-list">${esc(sessionsText(t.sessions || 0))} · ${money(t.cost || 0)}</h2></div>
        <span class="sub">${t.since ? esc(T("sinceDate", { d: fmtDate(t.since, { day: "2-digit", month: "2-digit", year: "numeric" }) })) : ""}${t.avg_price ? " · " + ppk(t.avg_price) : ""}</span>
      </div>
      ${list.length && !offline() ? exportsRow(d) : ""}
      ${list.length ? `<div class="scroll"><table>
        <thead><tr><th>${T("thDate")}</th><th>${siteHead(d)}</th><th class="n">kWh</th><th class="n">/kWh</th><th class="n">${T("thKw")}</th><th class="n">${T("thAmount")}</th><th>${T("thHa")}</th><th>${T("thInvoice")}</th></tr></thead>
        <tbody>${list.map((s, i) => `<tr${fold && i >= SESSIONS_FOLDED ? ' class="more"' : ""}>
          <td>${esc(dShort(s.start))}<span class="when-sub">${esc(tShort(s.start))}${s.duration_min != null ? " · " + s.duration_min + " min" : ""}</span></td>
          <td class="site">${esc(s.site)}${mpChip(s)}${s.idle ? `<span class="when-sub" style="color:var(--warn)">${esc(T("plusIdle", { p: money(s.idle) }))}</span>` : ""}${s.credit ? `<span class="when-sub" style="color:var(--good)">${esc(T("plusCredit", { p: money(s.credit) }))}</span>` : ""}</td>
          <td class="n">${s.kwh == null ? `<span class="muted">${T("open")}</span>` : num(s.kwh, 1)}</td>
          <td class="n" data-tone="${tone(s.price, avgPrice(d))}">${s.price == null ? "–" : money(s.price)}</td>
          <td class="n">${s.avg_kw == null ? "–" : s.slow ? `<span class="kw-slow">${num(s.avg_kw, 0)}</span><span class="when-sub kw-slow">${esc(T("slowSub", { typical: num(s.typical_kw, 0) }))}</span>` : num(s.avg_kw, 0)}</td>
          <td class="n">${money(s.cost)}</td>
          <td>${pushChipShort(s.push_state)}</td>
          <td>${s.has_invoice ? (!offline() ? `<a href="api/invoice/${encodeURIComponent(s.id)}" data-view="api/invoice/${encodeURIComponent(s.id)}" data-title="${esc(s.site + " · " + dShort(s.start))}" target="_blank" rel="noopener">PDF</a>` : `<span class="muted" title="${T("notInPreview")}">PDF</span>`) : '<span class="muted">–</span>'}</td>
        </tr>`).join("")}</tbody>
      </table></div>` : `<p class="sub">${T("noneYet")}</p>`}
      ${fold ? `<button class="btn more-btn" id="more-sessions" type="button" aria-expanded="${dyn.allSessions}">${dyn.allSessions ? T("showFewer") : esc(T("showAll", { n: list.length }))}</button>` : ""}
    </section>`;
  }

  function exportsRow(d) {
    const months = (d.monthly || []).filter((m) => m.sessions).reverse();
    const monthName = (key) => fmtDate(key + "-15T12:00:00Z", { month: "short", year: "numeric" });
    return `<div class="exports">
      <span class="label">${T("exportLabel")}</span>
      <a href="api/export.csv" data-download target="_blank" rel="noopener">${T("csvAll")}</a>
      ${months.map((m) => `<a href="api/report/${m.key}.pdf" data-view="api/report/${m.key}" target="_blank" rel="noopener">${esc(T("pdfMonth", { month: monthName(m.key) }))}</a>`).join("")}
      ${months.map((m) => `<a href="api/invoices/${m.key}.zip" data-download target="_blank" rel="noopener">${esc(T("zipMonth", { month: monthName(m.key) }))}</a>`).join("")}
    </div>`;
  }

  function reconcilePanel(d) {
    const r = d.reconcile || {};
    const line = (lbl, val) => `<div class="line"><span class="lbl">${lbl}</span><span class="dots"></span><span class="val">${val}</span></div>`;
    let verdict = "";
    if (r.diff != null) {
      const abs = Math.abs(r.diff);
      verdict = abs < 0.5 ? `<span class="chip good">${T("matches")}</span>`
        : `<span class="chip warn">${esc(T(r.diff > 0 ? "haAbove" : "haBelow", { p: money(abs) }))}</span>`;
    }
    return `<section class="panel" aria-labelledby="h-rec">
      <div><span class="eyebrow">${T("reconcile")}</span><h2 id="h-rec">${T("reconcileTitle")}</h2></div>
      <div class="compare">
        ${line(T("haCost"), money(r.ha_cost))}
        ${line(esc(T("perNInvoices", { n: r.inv_sessions || 0 })), money(r.inv_cost))}
        ${line(T("haKwh"), r.ha_kwh == null ? "–" : num(r.ha_kwh, 1) + " kWh")}
        ${line(T("billedKwh"), r.inv_kwh == null ? "–" : num(r.inv_kwh, 1) + " kWh")}
      </div>
      <div>${verdict}</div>
      <p class="sub">${T("reconcileText")}</p>
    </section>`;
  }

  function opsPanel(d) {
    const a = d.api || {};
    const st = d.setup || {};
    const s = d.sync || {};
    const usedPct = a.budget ? Math.min(100, (a.calls / a.budget) * 100) : 0;
    const connected = st.tesla_connected && !st.tesla_auth_error;
    const ents = (st.entities || []).join(", ");
    const haChip = st.ha_ok ? `<span class="chip good">${T("connected")}</span>`
      : st.ha_configured ? `<span class="chip bad">${T("unreachable")}</span>` : `<span class="chip warn">${T("notSetUp")}</span>`;
    return `<section class="panel" aria-labelledby="h-ops">
      <div><span class="eyebrow">${T("ops")}</span><h2 id="h-ops">${T("opsTitle")}</h2></div>
      <div class="status-list">
        <div><span>${T("tesla")}</span>${connected ? `<span class="chip good">${T("connected")}</span>` : `<span class="chip bad">${T("notConnected")}</span>`}</div>
        <div><span>${T("ha")}</span>${haChip}</div>
        ${ents ? `<div><span>${T("entities")}</span><span class="mono">${esc(ents)}</span></div>` : ""}
        <div><span>${T("lastSync")}</span><span>${esc(relTime(s.last))}</span></div>
        <div><span>${T("nextSync")}</span><span>${s.next ? esc(relTime(s.next)) : "–"}</span></div>
      </div>
      <div style="display:grid;gap:6px">
        <div style="display:flex;justify-content:space-between;gap:8px;font-size:.88rem"><span>${T("requests")}</span><span>${a.calls ?? 0} / ${a.budget ?? "–"}</span></div>
        <div class="meter" role="img" aria-label="${a.calls ?? 0} / ${a.budget}"><i style="width:${usedPct}%"></i></div>
        <span class="sub">${esc(T("apiCost", { usd: num(a.cost_usd, 2), credit: num(a.credit_usd, 0) }))}</span>
      </div>
      ${connected && !offline() ? `<div><button class="link-btn" id="btn-logout" type="button">${T("disconnect")}</button></div>` : ""}
    </section>`;
  }

  // --- Picture of the car -------------------------------------------------------------------------
  const carPic = (car, extraCls = "") => `<div class="car-pic ${extraCls}">
      <img src="${esc(car.url)}" alt="${esc(car.name)}" decoding="async" referrerpolicy="no-referrer">
      <span class="car-miss">${T("carLoadFailed")}</span>
    </div>`;


  function carPanelBody() {
    const ed = state.car;
    if (ed) return carEditorBody(ed);
    const car = state.data.car;
    const l = car.labels || {};
    return `<div class="car-head">
        <div class="car-text">
          <h2 id="h-car">${esc(car.name)}</h2>
          <p class="sub">${esc([l.generation, l.paint, l.wheel].filter(Boolean).join(" · "))}</p>
        </div>
        ${state.preview ? "" : `<div class="car-actions"><button class="btn" id="btn-car-edit" type="button">${T("carEdit")}</button></div>`}
      </div>
      ${carPic(car)}`;
  }

  function carEditorBody(ed) {
    const gen = ed.catalog.find((g) => g.key === ed.choice.generation) || ed.catalog[0];
    const trim = gen.trims.find((t) => t.key === ed.choice.trim) || gen.trims[0];
    const wheel = trim.wheels.find((w) => w.code === ed.choice.wheel) || trim.wheels[0];
    const opt = (value, label, current) => `<option value="${esc(value)}"${value === current ? " selected" : ""}>${esc(label)}</option>`;
    const select = (name, label, items, current) => `<label>${label}
        <select name="${name}"${items.length < 2 ? " disabled" : ""}>${items.map(([v, l]) => opt(v, l, current)).join("")}</select>
      </label>`;
    return `<div class="car-head">
        <div class="car-text">
          <h2 id="h-car">${esc(ed.view.name)}</h2>
          <p class="sub">${esc([ed.view.labels.paint, ed.view.labels.wheel].join(" · "))}</p>
          ${ed.auto ? "" : `<div><button class="link-btn" id="btn-car-reset" type="button">${T("carReset")}</button></div>`}
        </div>
        <div class="car-actions">
          <button class="btn primary" id="btn-car-save" type="button">${T("save")}</button>
          <button class="btn" id="btn-car-cancel" type="button">${T("cancel")}</button>
        </div>
      </div>
      ${carPic(ed.view, "")}
      <form class="car-form" id="car-form">
        ${select("generation", T("carModel"), ed.catalog.map((g) => [g.key, g.label]), gen.key)}
        ${select("trim", T("carTrim"), gen.trims.map((t) => [t.key, t.label]), trim.key)}
        ${select("wheel", T("carWheels"), trim.wheels.map((w) => [w.code, w.label]), wheel.code)}
        ${select("paint", T("carPaint"), wheel.paints.map((p) => [p.code, p.label]), ed.choice.paint)}
        ${select("view", T("carView"), gen.views.map((v) => [v.key, v.label]), ed.choice.view)}
      </form>
      <div class="car-note">${ed.auto ? `<p class="sub">${T("carAuto")}</p>` : ""}<p class="sub">${T("carSource")}</p><p class="sub">${T("carHa")}</p></div>`;
  }

  function renderCar() {
    const panel = $("#car-panel");
    if (!panel) return;
    panel.innerHTML = carPanelBody();
    bindCar();
  }

  function bindCar() {
    document.querySelectorAll(".car-pic img").forEach((img) => {
      const pic = img.closest(".car-pic");
      img.onerror = () => { pic.classList.remove("loading"); pic.classList.add("broken"); };
      img.onload = () => pic.classList.remove("loading", "broken");
    });
    const edit = $("#btn-car-edit");
    if (edit) edit.onclick = async () => {
      try {
        const r = await fetch("api/car", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const car = await r.json();
        state.car = { catalog: car.catalog, choice: car.choice, view: car, auto: car.auto };
        renderCar();
        $("#car-form select")?.focus();
      } catch (e) { toast(e.message); }
    };
    const form = $("#car-form");
    if (form) form.onchange = async (e) => {
      const ed = state.car;
      const choice = Object.fromEntries(new FormData(form).entries());
      // A new model or trim: let the server pick fitting wheels and paint again.
      if (e.target.name === "generation") { delete choice.trim; delete choice.wheel; delete choice.view; }
      if (e.target.name === "trim") delete choice.wheel;
      $("#car-panel .car-pic")?.classList.add("loading");
      try {
        const res = await post("api/car/preview", choice);
        if (state.car !== ed) return;  // closed meanwhile
        ed.choice = res.choice;
        ed.view = res;
        renderCar();
      } catch (err) { toast(err.message); }
    };
    const save = $("#btn-car-save");
    if (save) save.onclick = async () => {
      try {
        const res = await fetch("api/car", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state.car.choice) });
        if (!res.ok) throw new Error("HTTP " + res.status);
        state.car = null;
        toast(T("carSaved"));
        await load();
      } catch (e) { toast(e.message); }
    };
    const cancel = $("#btn-car-cancel");
    if (cancel) cancel.onclick = () => { state.car = null; renderCar(); };
    const reset = $("#btn-car-reset");
    if (reset) reset.onclick = async () => {
      try {
        const res = await fetch("api/car", { method: "DELETE" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        state.car = null;
        await load();
      } catch (e) { toast(e.message); }
    };
  }

  // --- Dynamic look ---------------------------------------------------------------------------------
  // Runs after each render, only in the dynamic look: the battery's state and the time of day go to
  // <html> for the light of the page; when the page opens, figures count up, tiles rise and bars
  // grow (not on the refresh every minute); a changed battery level counts to its new value; the
  // pointer lights the tile under it; radar rows, month columns and the session list react to taps.
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const dyn = { intro: true, soc: null, allSessions: false, month: null, openSlots: new Set(), introTimer: 0 };
  const SESSIONS_FOLDED = 6;
  const SLOT_HOURS = { night: [0, 6], morning: [6, 11], midday: [11, 16], afternoon: [16, 20], evening: [20, 24] };
  const COUNT_SEL = ".ring .big, .ring-range, .month-total .big, .kpi b, .fact b, .radar-val, .col .v, .readout b";

  function hourIn(tz) {
    try { return Number(new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", hourCycle: "h23" }).format(new Date())); }
    catch { return new Date().getHours(); }
  }
  const isNowSlot = (id, tz) => { const h = hourIn(tz), r = SLOT_HOURS[id]; return !!r && h >= r[0] && h < r[1]; };
  const daypart = (h) => (h >= 5 && h < 9 ? "dawn" : h >= 9 && h < 17 ? "day" : h >= 17 && h < 21 ? "dusk" : "night");
  function battState(s) {
    if (s.charging) return "charging";
    if (s.soc == null) return "ok";
    const floor = s.floor ?? 10;
    return s.soc <= floor ? "critical" : s.soc <= floor + 8 ? "low" : s.soc >= (s.target ?? 80) ? "full" : "ok";
  }
  function readoutHtml(m) {
    const total = (m.cost || 0) + (m.home_cost || 0);
    const bits = [m.label, num((m.kwh || 0) + (m.home_kwh || 0), 1) + " kWh"];
    if (m.sessions) bits.push(sessionsText(m.sessions));
    if (m.distance) bits.push(num(m.distance, 0) + " " + unit());
    if (m.avg_price) bits.push(ppk(m.avg_price));
    return `<b>${money(total)}</b><span>${esc(bits.join(" · "))}</span>`;
  }

  // Counts the first number in an element up from `from`, in the page's number format.
  function countUp(el, from) {
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walk.nextNode()) && !/\d/.test(node.nodeValue));
    if (!node) return;
    const parts = new Intl.NumberFormat(locale()).formatToParts(12345.6);
    const group = parts.find((x) => x.type === "group")?.value || ",";
    const dec = parts.find((x) => x.type === "decimal")?.value || ".";
    const rx = new RegExp("\\d[\\d" + group.replace(/[\\\]^-]/g, "\\$&") + dec.replace(/[\\\]^-]/g, "\\$&") + "]*\\d|\\d");
    const text = node.nodeValue, m = rx.exec(text);
    if (!m) return;
    const raw = m[0];
    const decimals = raw.includes(dec) ? raw.length - raw.lastIndexOf(dec) - 1 : 0;
    const value = Number(raw.split(group).join("").replace(dec, "."));
    if (!Number.isFinite(value) || value === from) return;
    const fmt = new Intl.NumberFormat(locale(), { minimumFractionDigits: decimals, maximumFractionDigits: decimals, useGrouping: raw.includes(group) });
    const start = performance.now(), dur = 1100;
    const step = (t) => {
      if (!node.isConnected) return;
      const k = Math.min(1, Math.max(0, (t - start) / dur)), e = 1 - Math.pow(1 - k, 3);
      node.nodeValue = k < 1 ? text.slice(0, m.index) + fmt.format(from + (value - from) * e) + text.slice(m.index + raw.length) : text;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function dynAfterRender() {
    const root = document.documentElement;
    if (!dynamic()) { delete root.dataset.batt; delete root.dataset.daypart; return; }
    const d = state.data, s = d.status || {};
    root.dataset.batt = battState(s);
    root.dataset.daypart = daypart(hourIn(d.tz));
    document.querySelectorAll("#content .hero, #content .panel").forEach((el, i) => el.style.setProperty("--i", i));
    const motion = !reduceMotion.matches;
    if (dyn.intro && motion) {
      const c = $("#content");
      c.classList.add("dyn-intro");
      clearTimeout(dyn.introTimer);
      dyn.introTimer = setTimeout(() => c.classList.remove("dyn-intro"), 2600);
      document.querySelectorAll(COUNT_SEL).forEach((el) => countUp(el, 0));
    } else if (motion && dyn.soc != null && s.soc != null && s.soc !== dyn.soc) {
      const el = $(".ring .big");
      if (el) countUp(el, dyn.soc);
    }
    dyn.intro = false;
    dyn.soc = s.soc ?? null;
  }

  function selectMonth(key) {
    const m = (state.data.monthly || []).find((x) => x.key === key);
    const out = $("#readout");
    if (!m || !out) return;
    dyn.month = key;
    out.innerHTML = readoutHtml(m);
    document.querySelectorAll(".col[data-month]").forEach((c) => c.classList.toggle("sel", c.dataset.month === key));
    if (!reduceMotion.matches) countUp(out.querySelector("b"), 0);
  }

  document.addEventListener("pointermove", (e) => {
    if (!dynamic() || e.pointerType !== "mouse") return;
    const p = e.target.closest?.(".panel");
    if (!p) return;
    const r = p.getBoundingClientRect();
    p.style.setProperty("--mx", e.clientX - r.left + "px");
    p.style.setProperty("--my", e.clientY - r.top + "px");
  }, { passive: true });
  document.addEventListener("pointerover", (e) => {
    if (!dynamic() || e.pointerType !== "mouse") return;
    const col = e.target.closest?.(".col[data-month]");
    if (col && col.dataset.month !== dyn.month) selectMonth(col.dataset.month);
  });
  function dynActivate(e) {
    if (!dynamic()) return;
    const row = e.target.closest(".radar-row[data-slot]");
    if (row) {
      const open = row.classList.toggle("open");
      row.setAttribute("aria-expanded", open);
      dyn.openSlots[open ? "add" : "delete"](row.dataset.slot);
      return;
    }
    const col = e.target.closest(".col[data-month]");
    if (col) { selectMonth(col.dataset.month); return; }
    const more = e.target.closest("#more-sessions");
    if (more) {
      dyn.allSessions = !dyn.allSessions;
      $("#sessions-panel").classList.toggle("show-all", dyn.allSessions);
      more.setAttribute("aria-expanded", dyn.allSessions);
      more.textContent = dyn.allSessions ? T("showFewer") : T("showAll", { n: (state.data.sessions || []).length });
    }
  }
  document.addEventListener("click", dynActivate);
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.closest?.(".radar-row[data-slot], .col[data-month]")) {
      e.preventDefault();
      dynActivate(e);
    }
  });

  // --- Interaction ---------------------------------------------------------------------------------
  function bindTooltips() {
    const tt = $("#tt");
    const show = (el, x, y) => {
      tt.textContent = el.dataset.tip;
      tt.hidden = false;
      const w = tt.offsetWidth, h = tt.offsetHeight;
      tt.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + "px";
      tt.style.top = (y - h - 12 < 8 ? y + 16 : y - h - 12) + "px";
    };
    document.querySelectorAll("[data-tip]").forEach((el) => {
      el.addEventListener("pointermove", (e) => show(el, e.clientX, e.clientY));
      el.addEventListener("pointerleave", () => (tt.hidden = true));
      el.addEventListener("focus", () => {
        const r = el.getBoundingClientRect();
        show(el, r.left + r.width / 2, r.top);
      });
      el.addEventListener("blur", () => (tt.hidden = true));
    });
  }

  function bindActions() {
    const syncBtn = $("#btn-sync");
    if (syncBtn) syncBtn.onclick = async () => {
      if (state.busy) return;
      state.busy = true;
      syncBtn.disabled = true;
      syncBtn.textContent = T("syncing");
      try {
        const res = await post("api/sync/now");
        toast(res.new ? T("toastSynced", { n: res.new }) : T("toastNothing"));
        await load();
      } catch (e) {
        toast(T("toastFailed", { e: e.message }));
        syncBtn.disabled = false;
        syncBtn.textContent = T("syncNow");
      } finally {
        state.busy = false;
      }
    };
    const form = $("#code-form");
    if (form) form.onsubmit = async (e) => {
      e.preventDefault();
      const value = $("#code-input").value.trim();
      if (!value) return;
      try {
        await post("auth/code", { value });
        toast(T("toastConnected"));
        setTimeout(load, 4000);
      } catch (err) {
        toast(err.message);
      }
    };
    const logout = $("#btn-logout");
    if (logout) logout.onclick = async () => {
      if (logout.dataset.armed !== "1") {
        logout.dataset.armed = "1";
        logout.textContent = T("confirmDisconnect");
        setTimeout(() => { logout.dataset.armed = ""; logout.textContent = T("disconnect"); }, 4000);
        return;
      }
      try { await post("auth/logout"); toast(T("toastDisconnected")); load(); } catch (e) { toast(e.message); }
    };
  }

  load().then(() => {
    if (new URLSearchParams(location.search).get("connected")) {
      toast(T("toastConnected"));
      history.replaceState(null, "", location.pathname);
    }
  });
  // Every minute; every 15 seconds while the car charges, so the battery follows closely.
  (function refresh() {
    setTimeout(async () => {
      try { if (!state.preview && !document.hidden && !state.car && !pdfView) await load(); } catch { /* shown on the next try */ }
      refresh();
    }, state.data?.status?.charging ? 15000 : 60000);
  })();
})();
</script>
