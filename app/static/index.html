<title>Ladecockpit</title>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ladecockpit">
<style id="look-classic">
/* Classic look (0.8): calm and dark like the car's own app – the car picture and the battery on top, flat tiles
   below, one sans-serif with tabular figures, blue for actions, green for the battery. */
@font-face {
  font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url(fonts/geist-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url(fonts/geist-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
:root {
  --bg: #ffffff;
  --panel: #f4f4f4;
  --sunk: #e9e9ea;
  --btn: #e2e3e4;
  --btn-hover: #d6d7d9;
  --line: #dcdddf;
  --ink: #171a20;
  --ink-2: #393c41;
  --mute: #5c5e62;
  --accent: #3e6ae1;
  --accent-fill: #3e6ae1;
  --accent-soft: #e3e9fb;
  --on-accent: #ffffff;
  --good: #1f8f4e;
  --good-soft: #dcf1e3;
  --battery: #2fb35a;
  --warn: #a35f00;
  --warn-soft: #f8ead2;
  --bad: #c9302c;
  --bad-soft: #f9dedd;
  --shadow: 0 10px 30px rgba(23, 26, 32, .12);

  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-code: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --panel: #151618;
    --sunk: #202124;
    --btn: #26272b;
    --btn-hover: #313237;
    --line: #2b2c30;
    --ink: #f2f2f2;
    --ink-2: #c8c9cc;
    --mute: #8f9095;
    --accent: #6d8ff3;
    --accent-fill: #3e6ae1;
    --accent-soft: #19223d;
    --on-accent: #ffffff;
    --good: #45cf74;
    --good-soft: #13291b;
    --battery: #3ccb6a;
    --warn: #ffb547;
    --warn-soft: #2f230e;
    --bad: #ff6159;
    --bad-soft: #351614;
    --shadow: 0 10px 30px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --panel: #151618;
  --sunk: #202124;
  --btn: #26272b;
  --btn-hover: #313237;
  --line: #2b2c30;
  --ink: #f2f2f2;
  --ink-2: #c8c9cc;
  --mute: #8f9095;
  --accent: #6d8ff3;
  --accent-fill: #3e6ae1;
  --accent-soft: #19223d;
  --on-accent: #ffffff;
  --good: #45cf74;
  --good-soft: #13291b;
  --battery: #3ccb6a;
  --warn: #ffb547;
  --warn-soft: #2f230e;
  --bad: #ff6159;
  --bad-soft: #351614;
  --shadow: 0 10px 30px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
  display: grid;
  gap: 16px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 500; }
p { margin: 0; }
a { color: var(--accent); }
.num, td.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-code); font-size: .9em; }

/* --- Kopf ------------------------------------------------------------------- */
.top {
  display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto; align-items: center; gap: 8px 20px;
}
.top .chips { justify-content: flex-end; }
@media (max-width: 720px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; }
  .top .chips { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
}
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: .01em; }
.brand .sub { font-size: .82rem; }
@media (max-width: 560px) { .brand .sub { display: none; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .8rem; font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.chip.plain::before { display: none; }
.chip.plain { color: var(--mute); }
.chip.good::before { background: var(--good); }
.chip.warn { color: var(--warn); }
.chip.warn::before { background: var(--warn); }
.chip.bad { color: var(--bad); }
.chip.bad::before { background: var(--bad); }
/* A tag rather than a status: MultiPass in lists. */
.chip.info { background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 6px; font-size: .74rem; }
.chip.info::before { display: none; }
.chip.pulse::before { animation: pulse 1.4s ease-in-out infinite; background: var(--accent); }
@keyframes pulse { 50% { opacity: .25; } }

.btn {
  font: inherit; font-weight: 500; font-size: .88rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px; min-height: 40px;
  border-radius: 8px; border: none;
  background: var(--btn); color: var(--ink);
  cursor: pointer; text-decoration: none;
  transition: background .15s;
}
.btn:hover { background: var(--btn-hover); }
.btn.primary { background: var(--accent-fill); color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent-fill) 88%, #fff); }
.btn[disabled], .btn.is-disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible, button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.banner {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 16px; border-radius: 12px;
  background: var(--warn-soft); color: var(--ink);
  font-size: .92rem;
}
.banner strong { color: var(--warn); font-weight: 600; }
.banner.bad { background: var(--bad-soft); }
.banner.bad strong { color: var(--bad); }

/* --- Kacheln ------------------------------------------------------------------- */
.panel {
  background: var(--panel);
  border-radius: var(--r);
  padding: 20px;
  min-width: 0;
  display: grid;
  align-content: start;
  gap: 14px;
}
.eyebrow { font-size: .86rem; font-weight: 500; color: var(--mute); }
.panel h2 { font-size: 1.15rem; font-weight: 500; letter-spacing: -.005em; }
.sub { color: var(--mute); font-size: .88rem; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }

/* --- Auto und Akku oben, ohne Kachel ------------------------------------------------ */
.hero { display: grid; gap: 6px; padding: 18px 4px 6px; }
.car-panel { display: grid; gap: 4px; }
.car-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 16px; }
.car-text { display: grid; gap: 2px; min-width: 0; }
.car-text h2 { font-size: clamp(1.7rem, 6vw, 2.3rem); font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.car-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.car-panel .car-form { margin-top: 8px; }
.car-note { margin-top: 6px; }
.car-pic { display: grid; place-items: center; min-height: 140px; margin-inline: auto; width: min(100%, 760px); }
.car-pic img { width: 100%; max-height: 300px; aspect-ratio: 2.4 / 1; object-fit: contain; display: block; }
.car-pic.broken img { display: none; }
.car-pic .car-miss { display: none; color: var(--mute); font-size: .86rem; padding: 32px 8px; text-align: center; }
.car-pic.broken .car-miss { display: block; }
.car-pic.loading img { opacity: .45; transition: opacity .2s; }
.car-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px; }
.car-form label { display: grid; gap: 4px; font-size: .8rem; font-weight: 500; color: var(--mute); min-width: 0; }
.car-form select {
  font: inherit; font-size: .92rem; color: var(--ink);
  padding: 8px 10px; min-height: 42px; border-radius: 8px; border: none;
  background: var(--btn); min-width: 0; width: 100%;
}
.car-note { display: grid; gap: 4px; overflow-wrap: anywhere; }

.battery { display: grid; gap: 10px; }
.battery-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 20px; }
.big {
  font-weight: 300; font-size: clamp(3rem, 13vw, 4.4rem); line-height: 1; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
}
.big small { font-size: .45em; font-weight: 400; margin-left: 6px; color: var(--mute); letter-spacing: 0; }
.range { font-weight: 300; font-size: clamp(1.5rem, 6vw, 2rem); letter-spacing: -.02em; color: var(--ink-2); }
.range small { color: var(--mute); font-weight: 400; font-size: .8rem; display: block; text-align: right; letter-spacing: 0; }

/* Battery bar: thin, green, with the floor and the charge limit marked underneath. */
.gauge { position: relative; padding-bottom: 22px; }
.gauge-window { display: none; }
.gauge-body { position: relative; }
.gauge-track { position: relative; height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.hero .gauge-track { background: var(--btn); }
.gauge-nub { display: none; }
.gauge-fill {
  position: absolute; inset: 0 auto 0 0; border-radius: 5px;
  background: var(--battery);
  transition: width .8s cubic-bezier(.2, .8, .2, 1);
}
.gauge-fill.warn { background: var(--warn); }
.gauge-fill.bad { background: var(--bad); }
.gauge-floor { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bg); opacity: .9; }
.gauge-limit { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bg); opacity: .9; }
.gauge-scale { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; }
.gauge-scale span {
  position: absolute; transform: translateX(-50%);
  font-size: .74rem; color: var(--mute); white-space: nowrap;
}
.gauge-scale span:first-child { transform: none; }
.gauge-scale span:last-child { transform: translateX(-100%); }
.stamp { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--mute); font-size: .86rem; }

/* --- Nächster Ladestopp ---------------------------------------------------------- */
.next-date { font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.4rem); line-height: 1.05; letter-spacing: -.025em; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--sunk); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.fact b { display: block; font-weight: 500; font-size: 1.05rem; }
.fact span { font-size: .76rem; color: var(--mute); }
.tip {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  padding: 12px 14px; border-radius: 12px; background: var(--sunk); font-size: .9rem;
}
.tip svg { color: var(--accent); margin-top: 2px; }

/* --- Letzte Ladung ---------------------------------------------------------------- */
.receipt { display: grid; gap: 0; }
.receipt .site { font-weight: 500; font-size: 1.15rem; letter-spacing: -.01em; }
.receipt .when { color: var(--mute); margin-bottom: 6px; font-size: .86rem; }
.line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 0; }
.line + .line, .receipt .line { border-top: 1px solid var(--line); }
.line .lbl { white-space: nowrap; color: var(--ink-2); }
.line .dots { flex: 1; min-width: 8px; }
.line .val { white-space: nowrap; font-variant-numeric: tabular-nums; }
.line.total { font-weight: 600; font-size: 1.05rem; }
.line.total .lbl { color: var(--ink); }
.line.zero .val { color: var(--mute); }
.receipt-actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }

/* --- Monat ------------------------------------------------------------------------------ */
.month { gap: 18px 40px; }
@media (min-width: 860px) { .month { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.month-main { display: grid; gap: 14px; align-content: start; min-width: 0; }
.month-total { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.month-total .big { font-size: clamp(2.5rem, 9vw, 3.2rem); }
.delta { font-size: .86rem; color: var(--mute); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--sunk); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kpi b { display: block; font-weight: 500; font-size: 1.1rem; }
.kpi span { font-size: .76rem; color: var(--mute); }
.exports { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .86rem; }
.exports .label { color: var(--mute); margin-right: 4px; }
.exports a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; background: var(--btn); color: var(--ink); text-decoration: none; font-weight: 500; }
.exports a:hover { background: var(--btn-hover); }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: .92rem; }
.compare { display: grid; gap: 0; font-size: .92rem; }
.compare .line .lbl { white-space: normal; min-width: 0; }  /* long labels wrap on phones */
.compare .cmp-group { display: grid; margin-top: 14px; }
.compare .cmp-head { color: var(--mute); font-size: .82rem; font-weight: 500; padding-bottom: 2px; }

/* --- Preis-Radar ---------------------------------------------------------------------- */
.radar { display: grid; gap: 12px; position: relative; }
.radar-row {
  display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 7.2rem; gap: 12px; align-items: center;
  border-radius: 8px; padding: 2px 0;
}
.radar-row .who b { display: block; font-size: .94rem; font-weight: 500; }
.radar-row .who span { font-size: .78rem; color: var(--mute); }
.radar-track { position: relative; height: 22px; }
.radar-bar {
  position: absolute; left: 0; top: 6px; bottom: 6px;
  background: var(--accent-fill); border-radius: 5px;
  transition: width .7s cubic-bezier(.2, .8, .2, 1);
}
.radar-row.best .radar-bar { background: var(--battery); }
.radar-empty { position: absolute; left: 0; right: 0; top: 10px; height: 0; border-top: 2px dotted var(--line); }
.radar-avg { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 1.5px dashed var(--mute); }
.radar-val { text-align: right; font-size: .9rem; font-weight: 500; }
.radar-val small { display: block; color: var(--mute); font-size: .74rem; font-weight: 400; }
.radar-axis { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 7.2rem; gap: 12px; }
.radar-axis .ticks { position: relative; height: 16px; }
.radar-axis .ticks span { position: absolute; top: 2px; transform: translateX(-50%); font-size: .72rem; color: var(--mute); }
.radar-axis .ticks span.avg { color: var(--ink-2); font-weight: 500; }
@media (max-width: 560px) {
  .radar-row, .radar-axis { grid-template-columns: 6.6rem minmax(0, 1fr) 5.8rem; gap: 8px; }
}
.insights { list-style: none; margin: 0; padding: 0; display: grid; }
.insights li {
  display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start;
  font-size: .9rem; padding: 12px 0; border-top: 1px solid var(--line); color: var(--ink-2);
}
.insights li svg { color: var(--accent); margin-top: 2px; }
.insights li.idle svg, .insights li.speed svg { color: var(--warn); }
.kw-slow, td .when-sub.kw-slow, .line.slow .val { color: var(--warn); }
.line-note { color: var(--warn); font-size: .8rem; text-align: right; padding-bottom: 6px; }

/* --- Tabellen -------------------------------------------------------------------------- */
.scroll { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th {
  text-align: left; font-size: .78rem; font-weight: 500;
  color: var(--mute); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
th.n, td.n { text-align: right; }
td.site { white-space: normal; min-width: 8rem; }
td .when-sub { display: block; color: var(--mute); font-size: .78rem; }
.minibar { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--btn); vertical-align: middle; margin-right: 8px; position: relative; overflow: hidden; }
.minibar i { position: absolute; inset: 0 auto 0 0; background: var(--accent-fill); border-radius: 3px; }
.op-chips { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.mp-list { list-style: none; margin: 0; padding: 0; display: grid; }
.mp-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.mp-list li:last-child { border-bottom: none; }
.mp-list .who b { display: block; font-size: .95rem; font-weight: 500; overflow-wrap: anywhere; }
.mp-list .who span { font-size: .8rem; color: var(--mute); }
.mp-val { text-align: right; font-size: .9rem; white-space: nowrap; }
.mp-val small { display: block; color: var(--mute); font-size: .76rem; }
.map-link { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; font-size: .86rem; font-weight: 500; color: var(--accent); text-decoration: none; }
.map-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.map-link svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 560px) { .mp-list li { gap: 10px; } .map-link span { display: none; } }
.link-btn { font: inherit; font-size: .86rem; font-weight: 500; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.muted { color: var(--mute); }

/* --- Monatsverlauf ------------------------------------------------------------------------ */
.cols { display: flex; align-items: flex-end; gap: 14px; height: 170px; padding-top: 22px; border-bottom: 1px solid var(--line); position: relative; }
.col { flex: 1; max-width: 90px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
.col .bar { width: 100%; max-width: 40px; background: var(--accent-fill); border-radius: 6px 6px 0 0; min-height: 2px; transition: height .7s cubic-bezier(.2, .8, .2, 1); }
.col.cur .bar { background: color-mix(in srgb, var(--accent-fill) 45%, var(--panel)); }
.col .v { font-size: .76rem; color: var(--ink-2); margin-bottom: 4px; white-space: nowrap; }
.col-labels { display: flex; gap: 14px; }
.col-labels span { flex: 1; max-width: 90px; text-align: center; font-size: .78rem; color: var(--mute); }

/* --- Abgleich / Betrieb ----------------------------------------------------------------------- */
.meter { height: 6px; border-radius: 3px; background: var(--btn); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent-fill); border-radius: 3px; }
.status-list { display: grid; font-size: .92rem; }
.status-list div { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 9px 0; border-top: 1px solid var(--line); }
.status-list div:first-child { border-top: none; }
.setup-steps { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: .92rem; }
form.code { display: flex; gap: 8px; flex-wrap: wrap; }
form.code input {
  flex: 1; min-width: 0; font: inherit; font-size: .88rem; padding: 9px 12px; border-radius: 8px;
  border: none; background: var(--btn); color: var(--ink);
}
details summary { cursor: pointer; font-weight: 500; font-size: .9rem; color: var(--ink-2); }
details[open] summary { margin-bottom: 10px; }

/* --- Tooltip & Toast ------------------------------------------------------------------------- */
.tt {
  position: fixed; z-index: 30; pointer-events: none;
  background: var(--ink); color: var(--bg);
  font-size: .8rem; line-height: 1.4; padding: 7px 10px; border-radius: 8px;
  max-width: 240px; box-shadow: var(--shadow);
}
.toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);

.meter { height: 6px; border-radius: 3px; background: var(--btn); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent-fill); border-radius: 3px; }
.status-list { display: grid; font-size: .92rem; }
.status-list div { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 9px 0; border-top: 1px solid var(--line); }
.status-list div:first-child { border-top: none; }
.setup-steps { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: .92rem; }
form.code { display: flex; gap: 8px; flex-wrap: wrap; }
form.code input {
  flex: 1; min-width: 0; font: inherit; font-size: .88rem; padding: 9px 12px; border-radius: 8px;
  border: none; background: var(--btn); color: var(--ink);
}
details summary { cursor: pointer; font-weight: 500; font-size: .9rem; color: var(--ink-2); }
details[open] summary { margin-bottom: 10px; }

/* --- Tooltip & Toast ------------------------------------------------------------------------- */
.tt {
  position: fixed; z-index: 30; pointer-events: none;
  background: var(--ink); color: var(--bg);
  font-size: .8rem; line-height: 1.4; padding: 7px 10px; border-radius: 8px;
  max-width: 240px; box-shadow: var(--shadow);
}
.toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  font-size: .9rem; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
.skeleton { color: var(--mute); padding: 40px 0; text-align: center; }
footer { color: var(--mute); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }



/* ===== Dynamic: what differs from the shared base above ======================================= */
[data-tone="A"] { --tone: var(--t-a); }
[data-tone="B"] { --tone: var(--t-b); }
[data-tone="C"] { --tone: var(--t-c); }
[data-tone="D"] { --tone: var(--t-d); }
[data-tone="E"] { --tone: var(--t-e); }
[data-tone="F"] { --tone: var(--t-f); }
[data-tone="G"] { --tone: var(--t-g); }

/* The sky behind the instruments: two slow lights, one for the battery, one for the time of day,
   over a faint grid. Fixed, so scrolling glides over it. */
body { background: var(--bg); }
body::before, body::after { content: ""; position: fixed; pointer-events: none; z-index: -1; }
body::before {
  inset: -25vmax;
  background:
    radial-gradient(42vmax 32vmax at 18% 12%, color-mix(in srgb, var(--state) 20%, transparent), transparent 70%),
    radial-gradient(55vmax 40vmax at 88% 0%, color-mix(in srgb, var(--sky) 34%, transparent), transparent 70%),
    radial-gradient(45vmax 40vmax at 55% 105%, color-mix(in srgb, var(--sky) 16%, transparent), transparent 70%);
  animation: dyn-sky 32s ease-in-out infinite alternate;
  transition: background 1.2s;
}
body::after {
  inset: 0;
  background: radial-gradient(rgba(170, 200, 255, .07) 1px, transparent 1.2px) 0 0 / 24px 24px;
  -webkit-mask: linear-gradient(180deg, #000, transparent 75%);
          mask: linear-gradient(180deg, #000, transparent 75%);
}
@keyframes dyn-sky { to { transform: translate3d(5vmax, 4vmax, 0) rotate(7deg) scale(1.08); } }

h1, h2, h3 { font-weight: 600; }

/* Head: the name with a small glowing ring */
.brand h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
.brand h1::before {
  content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 9px; vertical-align: 0;
  border-radius: 50%; border: 2.5px solid var(--state); box-shadow: 0 0 10px var(--state), inset 0 0 6px var(--state);
}
:root[data-batt="charging"] .brand h1::before { animation: dyn-pulse 1.6s ease-in-out infinite; }
.chip::before { box-shadow: 0 0 8px currentColor; }
.chip.good::before { box-shadow: 0 0 8px var(--good); }
.chip.info { background: var(--accent-soft); color: var(--accent); border-radius: 999px; }

/* Buttons: glass pills that light up */
.btn { border-radius: 999px; border: 1px solid var(--line); background: var(--btn); font-weight: 550; transition: background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { background: var(--btn-hover); border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 25%, transparent); }
.btn.primary { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 45%, transparent); }
.btn.primary:hover { background: var(--accent); }
.exports a { border: 1px solid var(--line); border-radius: 999px; }
.link-btn, .map-link, a { color: var(--accent); }

/* Tiles: dark glass with a lit edge; under the mouse a soft light follows the pointer */
.panel {
  position: relative; isolation: isolate; overflow: hidden;
  background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, 0) 120px), var(--panel);
  border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), var(--shadow);
}
.panel::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--state) 11%, transparent), transparent 65%);
}
.panel:hover::before { opacity: 1; }
.eyebrow {
  font-size: .7rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--mute);
  display: inline-flex; align-items: center; gap: 8px;
}
.eyebrow::before { content: ""; width: 14px; height: 2px; border-radius: 1px; background: var(--state); box-shadow: 0 0 8px var(--state); flex: none; }
.panel h2 { font-size: 1.12rem; font-weight: 600; letter-spacing: 0; }
.sub { color: var(--mute); }

/* Figures: Saira, wide and light, lit from inside */
.big, .range, .next-date, .kpi b, .fact b, .radar-val, .col .v, .readout b, .ring-range, td.n, .mp-val, .line .val {
  font-family: var(--f-num); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
}
.big { font-weight: 300; font-stretch: 112%; letter-spacing: -.01em; color: #fff; text-shadow: 0 0 26px color-mix(in srgb, var(--state) 40%, transparent); }
.big small { font-family: var(--f-body); font-weight: 400; color: var(--mute); text-shadow: none; }
.next-date { font-weight: 400; font-stretch: 112%; letter-spacing: 0; font-size: clamp(2rem, 6.5vw, 2.6rem); color: #fff; }
.month-total .big { font-size: clamp(2.8rem, 10vw, 3.7rem); }
.line .val { font-stretch: 105%; }
.line.total .val { font-weight: 600; color: #fff; text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent); }
td.n { font-stretch: 105%; }

/* Small figure blocks: lit edge on top */
.kpi, .fact {
  position: relative; background: var(--sunk); border-radius: 12px; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line);
}
.kpi::before, .fact::before {
  content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--state), transparent); opacity: .8;
}
.kpi b, .fact b { font-weight: 500; font-stretch: 108%; font-size: clamp(1.05rem, 4.2vw, 1.35rem); color: #fff; }
.kpi span, .fact span { text-transform: uppercase; letter-spacing: .08em; font-size: .64rem; }

.tip { background: var(--good-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--good) 25%, transparent); border-radius: 12px; }
.tip svg { color: var(--good); filter: drop-shadow(0 0 6px var(--good)); }
.insights li svg { color: var(--accent); }
.banner { border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 35%, transparent); }

/* --- The block on top: the car and the battery ring side by side --------------------------- */
.hero {
  position: relative; isolation: isolate; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 330px); align-items: center; gap: 12px 28px;
  padding: 22px 26px; border-radius: 26px; border: 1px solid var(--line);
  background:
    radial-gradient(70% 110% at 82% 50%, color-mix(in srgb, var(--state) 15%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(255, 255, 255, .045), transparent 50%), rgba(8, 12, 22, .66);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), var(--shadow);
  transition: background .8s;
}
.hero:not(:has(.car-panel)) { grid-template-columns: minmax(0, 1fr); }
.car-text h2 { font-family: var(--f-num); font-weight: 500; font-stretch: 115%; letter-spacing: .01em; font-size: clamp(1.9rem, 6vw, 2.6rem); }
.car-pic { position: relative; min-height: 120px; }
.car-pic img { position: relative; z-index: 1; filter: drop-shadow(0 22px 26px rgba(0, 0, 0, .65)); }
.car-pic::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: 8%; height: 22%; z-index: 0;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--state) 45%, transparent), transparent);
  filter: blur(8px); transition: background .8s;
}

/* The ring on the right; the car's name and picture, the charging readouts and the stamp on the left */
.hero { grid-template-rows: minmax(0, 1fr) auto auto; }
.hero > .car-panel { grid-column: 1; grid-row: 1; align-self: start; }
.dyn-battery { display: contents; }
.dyn-battery .ring { grid-column: 2; grid-row: 1 / span 3; align-self: center; justify-self: center; }
.dyn-battery .charge-facts { grid-column: 1; grid-row: 2; }
.dyn-battery .stamp { grid-column: 1; grid-row: 3; }
.hero:not(:has(.car-panel)) .dyn-battery .ring { grid-column: 1 / -1; }
@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; padding: 18px 16px; border-radius: 22px; }
  .hero > .car-panel, .dyn-battery .ring, .dyn-battery .charge-facts, .dyn-battery .stamp { grid-column: 1 / -1; grid-row: auto; }
  .dyn-battery .charge-facts, .dyn-battery .stamp { justify-content: center; text-align: center; }
}
.ring { position: relative; width: min(100%, 320px); max-width: 100%; aspect-ratio: 1; }
.ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring-track { fill: none; stroke: rgba(255, 255, 255, .07); stroke-width: 13; stroke-linecap: round; }
.ring-fill {
  fill: none; stroke: url(#ring-grad); stroke-width: 13; stroke-linecap: round; stroke-dasharray: 1 1;
  filter: drop-shadow(0 0 9px var(--state));
}
.ring-flow {
  fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; opacity: .75;
  stroke-dasharray: .012 .045; animation: dyn-flow 1.1s linear infinite;
}
.ring-stop { stop-color: var(--state); transition: stop-color .8s; }
.ring-stop.from { stop-color: var(--state-2); }
.tick { stroke: rgba(255, 255, 255, .16); stroke-width: 1.6; stroke-linecap: round; }
.tick.major { stroke-width: 2.4; }
.tick.lit { stroke: var(--state); filter: drop-shadow(0 0 3px var(--state)); }
.mark { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.mark-label { fill: var(--ink-2); font: 600 9.5px var(--f-num); text-anchor: middle; dominant-baseline: middle; }
.ring-center { position: absolute; inset: 14% 14% 16%; display: grid; place-content: center; justify-items: center; text-align: center; gap: 2px; }
.ring .big { font-size: clamp(3.3rem, 14vw, 4.4rem); line-height: 1; }
.ring .big small { margin-left: 2px; }
.ring-range { color: var(--ink-2); font-stretch: 108%; font-size: 1.05rem; }
.ring-state {
  margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--state); background: color-mix(in srgb, var(--state) 12%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--state) 30%, transparent);
}
.ring-state svg { width: 13px; height: 13px; }
:root[data-batt="charging"] .ring-state svg { animation: dyn-pulse 1.2s ease-in-out infinite; }
:root[data-batt="charging"] .ring-fill { animation: dyn-breathe 2.4s ease-in-out infinite; }
.charge-facts { display: flex; flex-wrap: wrap; gap: 8px; }
.charge-facts span {
  display: grid; gap: 2px; min-width: 96px;
  font-family: var(--f-num); font-stretch: 110%; font-size: 1.45rem; font-weight: 400; line-height: 1.1; color: #fff;
  padding: 9px 14px 10px; border-radius: 14px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line);
  text-shadow: 0 0 18px color-mix(in srgb, var(--state) 40%, transparent);
}
.charge-facts b { font-weight: inherit; }
.charge-facts small { font-family: var(--f-body); color: var(--mute); font-size: .64rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; text-shadow: none; }

/* --- Price radar: lit bars, the slot of right now marked ----------------------------------- */
.radar-track { height: 24px; }
.radar-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.radar-bar, .radar-row.best .radar-bar {
  top: 6px; bottom: 6px; border-radius: 6px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--tone, var(--accent)) 25%, transparent), var(--tone, var(--accent)));
  box-shadow: 0 0 14px color-mix(in srgb, var(--tone, var(--accent)) 55%, transparent);
  transform-origin: left center;
}
.radar-avg { border-left: 1.5px dashed rgba(255, 255, 255, .45); }
.radar-val { font-weight: 500; font-stretch: 108%; color: #fff; }
.radar-row { cursor: pointer; padding: 6px 8px; margin-inline: -8px; border-radius: 12px; transition: background .2s; }
.radar-row:hover, .radar-row.open { background: var(--sunk); }
.radar-row.now { background: color-mix(in srgb, var(--accent) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
.now-pill {
  display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; vertical-align: 1px;
  font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--on-accent); background: var(--accent); box-shadow: 0 0 12px var(--accent);
  animation: dyn-glow 2s ease-in-out infinite;
}
.radar-more { grid-column: 1 / -1; display: none; color: var(--ink-2); font-size: .84rem; padding: 2px 0 4px; }
.radar-row.open .radar-more { display: block; }
.tone-legend { display: flex; align-items: center; gap: 10px; font-size: .74rem; color: var(--mute); }
.tone-legend .scale {
  width: 120px; height: 6px; flex: none; border-radius: 3px;
  background: linear-gradient(90deg, var(--t-a), var(--t-b), var(--t-c), var(--t-d), var(--t-e), var(--t-f), var(--t-g));
  box-shadow: 0 0 10px rgba(255, 255, 255, .15);
}

/* Lists: a lit dot in the price colour */
.minibar { background: var(--sunk); }
.minibar i { background: var(--tone, var(--accent)); box-shadow: 0 0 8px var(--tone, var(--accent)); transform-origin: left center; }
td[data-tone]:not([data-tone=""])::before {
  content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; vertical-align: 1px;
  background: var(--tone); box-shadow: 0 0 8px var(--tone);
}
tbody tr { transition: background .2s; }
tbody tr:hover { background: var(--sunk); }
tr.more { display: none; }
.show-all tr.more { display: table-row; }
.more-btn { justify-self: center; }

/* Month history: lit columns, the running month shimmering; a readout for the chosen month */
.readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; min-height: 2.6em; font-size: .86rem; color: var(--ink-2); }
.readout b { font-weight: 500; font-stretch: 110%; font-size: 1.35rem; color: #fff; }
.col { cursor: pointer; }
.col .bar {
  max-width: 34px; border-radius: 8px 8px 2px 2px; transform-origin: bottom center;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 20%, transparent));
  box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: box-shadow .2s, filter .2s;
}
.col.cur .bar {
  background: repeating-linear-gradient(135deg, var(--accent) 0 5px, color-mix(in srgb, var(--accent) 35%, transparent) 5px 10px);
  background-size: 200% 200%; animation: dyn-stripes 3s linear infinite;
}
.col.sel .bar, .col:hover .bar { filter: brightness(1.25); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 60%, transparent); }
.col .v { font-weight: 500; color: var(--ink-2); }
.col.sel .v { color: #fff; }
.cols { border-bottom-color: var(--line); }
.spark-line { stroke: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
.spark-area { fill: url(#spark-grad); stroke: none; }

.meter { background: var(--sunk); }
.meter i { background: linear-gradient(90deg, var(--accent-fill), var(--accent)); box-shadow: 0 0 10px var(--accent); transform-origin: left center; }

.car-form select, form.code input { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); }
.car-form select option { background: var(--panel-solid); color: var(--ink); }
.tt, .toast { background: rgba(12, 18, 32, .94); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0, 0, 0, .6); }
footer .look-pick button[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent); }

/* --- Motion -------------------------------------------------------------------------------- */
@keyframes dyn-pulse { 50% { opacity: .45; } }
@keyframes dyn-glow { 50% { box-shadow: 0 0 2px var(--accent); } }
@keyframes dyn-breathe { 50% { filter: drop-shadow(0 0 18px var(--state)); } }
@keyframes dyn-flow { to { stroke-dashoffset: -.057; } }
@keyframes dyn-stripes { to { background-position: 28px 0; } }
@keyframes dyn-rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes dyn-grow-x { from { transform: scaleX(0); } }
@keyframes dyn-grow-y { from { transform: scaleY(0); } }
@keyframes dyn-draw { from { stroke-dashoffset: 1; } }
@keyframes dyn-fade { from { opacity: 0; } }
/* When the page opens (or the look is switched on): tiles rise one after the other, bars grow,
   the ring draws itself. Not on the refresh every minute. */
.dyn-intro .hero, .dyn-intro .panel { animation: dyn-rise .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.dyn-intro .radar-bar, .dyn-intro .minibar i, .dyn-intro .meter i { animation: dyn-grow-x 1.1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 250ms); }
.dyn-intro .col .bar { animation: dyn-grow-y 1.1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 250ms); }
.dyn-intro .ring-fill { animation: dyn-draw 1.6s cubic-bezier(.2, .8, .2, 1) both .15s; }
.dyn-intro .tick.lit { animation: dyn-fade .5s both; animation-delay: calc(var(--t, 0) * 40ms + 150ms); }
@media (prefers-reduced-motion: reduce) {
  body::before, .ring-flow, .now-pill, .col.cur .bar, :root[data-batt="charging"] .ring-fill,
  :root[data-batt="charging"] .ring-state svg, :root[data-batt="charging"] .brand h1::before { animation: none; }
}
</style>

    if (!iso) return T("unknown");
    const diff = (Date.now() - new Date(iso).getTime()) / 60000;
    if (diff < 0) {
      const m = -diff;
      if (m < 60) return T("inMin", { n: Math.round(m) });
      if (m < 60 * 36) return T("inH", { n: Math.round(m / 60) });
      return T("onDate", { d: dShort(iso) });
    }
    if (diff < 2) return T("justNow");
    if (diff < 60) return T("minAgo", { n: Math.round(diff) });
    if (diff < 60 * 24) return T("hAgo", { n: Math.round(diff / 60) });
    if (diff < 60 * 48) return T("yesterday", { t: tShort(iso) });
    return `${dShort(iso)} ${tShort(iso)}`;
  }

      if (!r.ok) throw new Error("HTTP " + r.status);
      state.data = await r.json();
      state.preview = false;
      if (state.data.look && state.data.look !== look) applyLook(state.data.look);
    } catch (err) {
      const el = document.getElementById("preview-data");

      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await r.json(); } catch { /* empty body */ }
    if (!r.ok) throw new Error(data.detail || "HTTP " + r.status);
    return data;
  }

  const offline = () => state.preview || state.data?.mode === "demo";

  // Where a price sits against your average list price: A (much cheaper) … D (about average) … G
  // (much dearer). The dynamic look colours prices with it; the classic look ignores it.
  const avgPrice = (d) => d.totals?.list_price ?? d.totals?.avg_price;
  function tone(price, avg) {
    if (price == null || !avg) return "";
    const r = price / avg;
    const i = [0.8, 0.88, 0.96, 1.04, 1.12, 1.2].findIndex((x) => r < x);
    return "ABCDEFG"[i < 0 ? 6 : i];
  }

  // --- Look: classic or dynamic -----------------------------------------------------------------
  // Two stylesheets on the same markup; the one not in use is switched off. The dynamic look adds
  // a few pieces of its own (the battery ring, readouts, motion – see "Dynamic look" below).
  // Chosen in the footer and saved in Ladecockpit, so every device shows the same. The browser
  // also remembers it, only to avoid a flash of the other look while the page loads.
  let look = document.documentElement.dataset.look === "dynamic" ? "dynamic" : "classic";
  const dynamic = () => look === "dynamic";
  const themeMetas = [...document.querySelectorAll('meta[name="theme-color"]')].map((m) => [m, m.content]);

  function applyLook(next) {
    const was = look;
    look = next === "dynamic" || next === "modern" ? "dynamic" : "classic";
    $("#look-dynamic").media = dynamic() ? "all" : "not all";
    $("#look-classic").media = dynamic() ? "not all" : "all";
    document.documentElement.dataset.look = look;
    themeMetas.forEach(([m, c]) => (m.content = dynamic() ? "#04060b" : c));  // always dark
    if (look !== was) dyn.intro = true;
    try { localStorage.setItem("ladecockpit-look", look); } catch { /* private mode */ }
  }

  document.addEventListener("click", async (e) => {
    const btn = e.target.closest(".look-pick [data-look]");
    if (!btn || btn.dataset.look === look) return;
    const before = look;
    applyLook(btn.dataset.look);
    if (state.data) { state.data.look = look; render(); }
    if (state.preview) return;
    try {
      const r = await fetch("api/look", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ look }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
    } catch (err) {
      toast(T("lookFailed", { e: err.message }));
      applyLook(before);
      if (state.data) { state.data.look = look; render(); }
    }
  });

  // --- PDFs in the Home Assistant app -------------------------------------------------------------
  // The companion apps show this page in a web view that has no PDF viewer, and a link that opens
  // a new window lands outside the Home Assistant sign-in. In the app, PDF links therefore open a
  // view with the pages as pictures, and downloads are fetched here and handed to the app as a
  // file. In a normal browser nothing changes.
  const inHaApp = /\bHome Assistant\//.test(navigator.userAgent);
  let pdfView = null;  // { el, file } while the view is open

  function filenameOf(r, url) {
    const cd = r.headers.get("Content-Disposition") || "";
    const m = /filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i.exec(cd);
    return m ? decodeURIComponent(m[1] || m[2]) : url.split("/").pop();
  }

  async function errorText(r) {
    try { return (await r.json()).detail || "HTTP " + r.status; } catch { return "HTTP " + r.status; }
  }

  async function downloadInApp(url) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(await errorText(r));
      const href = URL.createObjectURL(await r.blob());
      const a = document.createElement("a");
      a.href = href;
      a.download = filenameOf(r, url);
      document.body.appendChild(a);
      a.click();
      a.remove();
      // The app reads the file from this address after the click, so keep it for a while.
      setTimeout(() => URL.revokeObjectURL(href), 120000);
      toast(T("dlStarted"));
    } catch (e) {
      toast(T("dlFailed", { e: e.message }));
    }
  }

  async function openPdfView(base, file, title) {
    if (pdfView) return;
    const el = document.createElement("div");
    el.className = "pdf-view";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", title);
    el.innerHTML = `<div class="pdf-bar">
        <span class="pdf-title">${esc(title)}</span>
        <button class="btn" type="button" data-pdf="download">${T("pdfDownload")}</button>
        <button class="btn pdf-x" type="button" data-pdf="close" aria-label="${T("pdfClose")}" title="${T("pdfClose")}">×</button>
      </div>
      <div class="pdf-pages"><p class="pdf-msg">${T("pdfLoading")}</p></div>`;
    document.body.appendChild(el);
    document.body.style.overflow = "hidden";
    pdfView = { el, file };
    // The back gesture of the app closes the view instead of leaving Ladecockpit.
    history.pushState({ pdfView: true }, "");
    el.querySelector('[data-pdf="close"]').focus();
    const pages = el.querySelector(".pdf-pages");
    try {
      const r = await fetch(base + "/pages", { cache: "no-store" });
      if (!r.ok) throw new Error(await errorText(r));
      const n = (await r.json()).pages;
      if (pdfView?.el !== el) return;
      const label = (i) => esc(T("pdfPage", { n: i, m: n }));
      pages.innerHTML = `<p class="pdf-hint">${T("pdfZoom")}</p>` + Array.from({ length: n }, (_, i) => `<figure>
          <img src="${base}/page/${i + 1}.png" alt="${label(i + 1)}" loading="${i ? "lazy" : "eager"}" decoding="async">
          ${n > 1 ? `<figcaption>${label(i + 1)}</figcaption>` : ""}</figure>`).join("");
    } catch (e) {
      if (pdfView?.el === el) pages.innerHTML = `<p class="pdf-msg">${esc(T("pdfFailed", { e: e.message }))}</p>`;
    }
  }

  function closePdfView(fromHistory = false) {
    if (!pdfView) return;
    pdfView.el.remove();
    pdfView = null;
    document.body.style.overflow = "";
    if (!fromHistory && history.state?.pdfView) history.back();
  }

  document.addEventListener("click", (e) => {
    if (pdfView) {
      const act = e.target.closest("[data-pdf]")?.dataset.pdf;
      if (act === "close") closePdfView();
      else if (act === "download") downloadInApp(pdfView.file);
      else e.target.closest(".pdf-pages figure")?.classList.toggle("zoomed");
      return;
    }
    if (!inHaApp) return;
    const a = e.target.closest("a[data-view], a[data-download]");
    if (!a) return;
    e.preventDefault();
    if (a.hasAttribute("data-view")) openPdfView(a.dataset.view, a.getAttribute("href"), a.dataset.title || a.textContent.trim());
    else downloadInApp(a.getAttribute("href"));
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePdfView(); });
  window.addEventListener("popstate", () => closePdfView(true));

  function renderChips(d) {
    const chips = [];
    if (state.preview) chips.push(`<span class="chip warn">${T("preview")}</span>`);
    else if (d.mode === "demo") chips.push(`<span class="chip warn">${T("demoMode")}</span>`);
    else chips.push(`<span class="chip good">${T("live")}</span>`);

    if (s.burst) chips.push(`<span class="chip info pulse">${T("searching")}</span>`);
    else if (s.error) chips.push(`<span class="chip bad">${T("syncBroken")}</span>`);
    else if (s.last) chips.push(`<span class="chip plain">${esc(T("synced", { when: relTime(s.last) }))}</span>`);
    const dis = offline() || !d.setup?.tesla_connected ? "disabled" : "";
    $("#chips").innerHTML = chips.join("");
    $("#top-actions").innerHTML = `<button class="btn" id="btn-sync" ${dis} title="${dis ? T("connectFirst") : T("syncTitle")}">${T("syncNow")}</button>`;
  }

  function renderBanners(d) {
    const out = [];
    if (state.preview) out.push(`<div class="banner"><div>${T("previewBanner")}</div></div>`);
    const st = d.setup || {};
    if (st.tesla_auth_error) out.push(`<div class="banner bad"><div><strong>${T("authExpired")}</strong> ${esc(st.tesla_auth_error)}</div></div>`);
    if (d.sync?.error && !st.tesla_auth_error) out.push(`<div class="banner bad"><div><strong>${T("lastSyncFailed")}</strong> ${esc(d.sync.error)}</div></div>`);
    if (st.ha_configured && (st.entities || []).length && !st.ha_ok) out.push(`<div class="banner bad"><div><strong>${T("haDown")}</strong> ${esc(st.ha_error || T("haHint"))}</div></div>`);
    if ((st.missing_entities || []).length) out.push(`<div class="banner"><div><strong>${T("missingEntities")}</strong> <span class="mono">${esc(st.missing_entities.join(", "))}</span>. ${T("missingHint")}</div></div>`);
    $("#banners").innerHTML = out.join("");
    $("#banners").hidden = out.length === 0;
  }

  function setupPanel(d) {
    const st = d.setup || {};
    if (offline() || (st.tesla_connected && !st.tesla_auth_error)) return "";
    if (!st.tesla_configured) {
      return `<section class="panel"><span class="eyebrow">${T("setup")}</span><h2>${T("teslaMissing")}</h2><p class="sub">${T("teslaMissingText")}</p></section>`;
    }
    return `<section class="panel">
      <span class="eyebrow">${T("setup")}</span>
      <h2>${T("connectTitle")}</h2>
      <p class="sub">${T("connectText")}</p>
      ${st.addon ? `<ol class="steps">
        <li>${T("addonStep1")}</li>
        <li>${T("addonStep2", { uri: esc(st.redirect_uri || "") })}</li>
        <li>${T("addonStep3")}</li>
      </ol>` : ""}
      <div><a class="btn primary" href="auth/login" target="${st.addon ? "_blank" : "_self"}" rel="noopener">${T("signIn")}</a></div>
      ${st.addon ? codeForm() : `<details>
        <summary>${T("redirectHelp")}</summary>
        <p class="sub" style="margin-bottom:10px">${T("redirectText")} <span class="mono">${esc(st.redirect_uri || "")}</span></p>

  function codeForm() {
    return `<form class="code" id="code-form">
      <label for="code-input" hidden>${T("addrOrCode")}</label>

      <button class="btn" type="submit">${T("connect")}</button>
