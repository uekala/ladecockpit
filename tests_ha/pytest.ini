# Tests der Home-Assistant-Integration in custom_components/ladecockpit.
# Sie brauchen Home Assistant selbst: pip install pytest-homeassistant-custom-component,
# dann ausführen: pytest -c tests_ha/pytest.ini tests_ha
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = ..
testpaths = .
