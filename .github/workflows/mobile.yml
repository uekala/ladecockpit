name: Mobile app builds

on:
  push:
    branches: [main, "feature/mobile-app-ios-android"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name ladecockpit .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK (retry transient Gradle download failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            set +e
            flutter build apk --release 2>&1 | tee /tmp/ladecockpit-android-build.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eiq 'HTTP response code: 5[0-9]{2}|Server returned HTTP response code: 5[0-9]{2}|status code 5[0-9]{2}|Gateway Time[- ]out|timed out|Connection reset|UnknownHostException|error while downloading artifacts from the network' /tmp/ladecockpit-android-build.log; then
              echo "Android build failed for a non-transient reason; not retrying."
              exit "$status"
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Transient Gradle/network error. Retry $((attempt + 1))/3 in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Android build failed after 3 attempts."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ladecockpit-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name ladecockpit .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ladecockpit-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
