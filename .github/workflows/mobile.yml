name: Mobile app builds

on:
  push:
    branches: [main, "feature/mobile-app-ios-android"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name ladecockpit .
      - name: Generate branded Android and iOS launcher icons
        working-directory: .
        run: |
          python3 -m venv /tmp/ladecockpit-icon-venv
          /tmp/ladecockpit-icon-venv/bin/python -m pip install --quiet cairosvg
          /tmp/ladecockpit-icon-venv/bin/python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="mobile/assets/ladecockpit_icon.svg",
              write_to="mobile/assets/ladecockpit_icon.png",
              output_width=1024,
              output_height=1024,
          )
          PY
      - name: Allow cleartext HTTP only to the configured Tailscale host
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android_dir = Path("mobile/android/app/src/main")
          manifest = android_dir / "AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          root = tree.getroot()
          internet_permission = "android.permission.INTERNET"
          if not any(
              permission.get(f"{{{android_ns}}}name") == internet_permission
              for permission in root.findall("uses-permission")
          ):
              permission = ET.Element("uses-permission")
              permission.set(f"{{{android_ns}}}name", internet_permission)
              root.insert(0, permission)
          application.set(f"{{{android_ns}}}networkSecurityConfig", "@xml/network_security_config")
          xml_dir = android_dir / "res" / "xml"
          xml_dir.mkdir(parents=True, exist_ok=True)
          config = """<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          """
          (xml_dir / "network_security_config.xml").write_text(config, encoding="utf-8")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          verified = ET.parse(manifest).getroot()
          if not any(
              permission.get(f"{{{android_ns}}}name") == internet_permission
              for permission in verified.findall("uses-permission")
          ):
              raise SystemExit("Release manifest is missing android.permission.INTERNET")
          print("Verified android.permission.INTERNET in the main release manifest")
          print("App-level endpoint allowlist restricts cleartext HTTP to the configured Tailscale host and exact Tailscale IPv4 address")
          PY
      - name: Use Gradle direct download host
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          content = path.read_text()
          updated, count = re.subn(
              r"https\\://github\\.com/gradle/gradle-distributions/releases/download/v[^/]+/",
              r"https\\://downloads.gradle.org/distributions/",
              content,
          )
          if count == 0:
              updated, count = re.subn(
                  r"https\\://services.gradle.org/distributions/",
                  r"https\\://downloads.gradle.org/distributions/",
                  content,
              )
          if count == 0:
              raise SystemExit(f"No known Gradle distribution URL found in {path}")
          path.write_text(updated)
          print(next(line for line in updated.splitlines() if line.startswith("distributionUrl=")))
          PY
      - name: Add Google-hosted Maven Central mirror to Gradle settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle.kts")
          content = path.read_text()
          marker = "repositories {"
          mirror = '''repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }'''
          if marker not in content:
              raise SystemExit("Gradle settings repositories block not found")
          content = content.replace(marker, mirror)
          path.write_text(content)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK (retry transient Gradle download failures)
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            set +e
            flutter build apk --release 2>&1 | tee /tmp/ladecockpit-android-build.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eiq '504|5[0-9]{2}|Gateway Time[- ]out|Gateway Timeout|timed out|Connection reset|UnknownHostException|error while downloading artifacts from the network|Could not GET' /tmp/ladecockpit-android-build.log; then
              echo "Android build failed for a non-transient reason; not retrying."
              exit "$status"
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "Transient Gradle/network error. Retry $((attempt + 1))/5 in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Android build failed after 5 attempts."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ladecockpit-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name ladecockpit .
      - name: Generate branded Android and iOS launcher icons
        working-directory: .
        run: |
          python3 -m venv /tmp/ladecockpit-icon-venv
          /tmp/ladecockpit-icon-venv/bin/python -m pip install --quiet cairosvg
          /tmp/ladecockpit-icon-venv/bin/python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="mobile/assets/ladecockpit_icon.svg",
              write_to="mobile/assets/ladecockpit_icon.png",
              output_width=1024,
              output_height=1024,
          )
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ladecockpit-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
