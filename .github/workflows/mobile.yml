name: Mobile app builds

on:
  push:
    branches: [main, "feature/mobile-app-ios-android"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Release-Build: Abbruch, wenn der Signaturschlüssel fehlt"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter create --platforms=android,ios --org io.github.uekala --project-name ladecockpit .
      - name: Check the Android application ID
        run: grep -q 'applicationId = "io.github.uekala.ladecockpit"' android/app/build.gradle.kts
      - name: Generate branded Android and iOS launcher icons
        working-directory: .
        run: |
          python3 -m venv /tmp/ladecockpit-icon-venv
          /tmp/ladecockpit-icon-venv/bin/python -m pip install --quiet cairosvg
          /tmp/ladecockpit-icon-venv/bin/python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="mobile/assets/ladecockpit_icon.svg",
              write_to="mobile/assets/ladecockpit_icon.png",
              output_width=1024,
              output_height=1024,
          )
          PY
      - name: Allow cleartext HTTP at platform level (the app limits it to private networks)
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android_dir = Path("mobile/android/app/src/main")
          manifest = android_dir / "AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          root = tree.getroot()
          internet_permission = "android.permission.INTERNET"
          if not any(
              permission.get(f"{{{android_ns}}}name") == internet_permission
              for permission in root.findall("uses-permission")
          ):
              permission = ET.Element("uses-permission")
              permission.set(f"{{{android_ns}}}name", internet_permission)
              root.insert(0, permission)
          application.set(f"{{{android_ns}}}networkSecurityConfig", "@xml/network_security_config")
          xml_dir = android_dir / "res" / "xml"
          xml_dir.mkdir(parents=True, exist_ok=True)
          config = """<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          """
          (xml_dir / "network_security_config.xml").write_text(config, encoding="utf-8")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          verified = ET.parse(manifest).getroot()
          if not any(
              permission.get(f"{{{android_ns}}}name") == internet_permission
              for permission in verified.findall("uses-permission")
          ):
              raise SystemExit("Release manifest is missing android.permission.INTERNET")
          print("Verified android.permission.INTERNET in the main release manifest")
          print("The app itself allows cleartext HTTP only to private network and Tailscale addresses")
          PY
      - name: Use Gradle direct download host
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          content = path.read_text()
          updated, count = re.subn(
              r"https\\://github\\.com/gradle/gradle-distributions/releases/download/v[^/]+/",
              r"https\\://downloads.gradle.org/distributions/",
              content,
          )
          if count == 0:
              updated, count = re.subn(
                  r"https\\://services.gradle.org/distributions/",
                  r"https\\://downloads.gradle.org/distributions/",
                  content,
              )
          if count == 0:
              raise SystemExit(f"No known Gradle distribution URL found in {path}")
          path.write_text(updated)
          print(next(line for line in updated.splitlines() if line.startswith("distributionUrl=")))
          PY
      - name: Add Google-hosted Maven Central mirror to Gradle settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle.kts")
          content = path.read_text()
          marker = "repositories {"
          mirror = '''repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }'''
          if marker not in content:
              raise SystemExit("Gradle settings repositories block not found")
          content = content.replace(marker, mirror)
          path.write_text(content)
          PY
      - name: Configure persistent release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRED: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release)) && '--required' || '' }}
        run: python3 tool/configure-android-signing.py $REQUIRED
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK (retry transient Gradle download failures)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          # versionCode muss bei jedem Update steigen; die Laufnummer dieses Workflows tut das.
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1))
          echo "Build-Nummer: $BUILD_NUMBER"
          # Bei einem Release trägt die App die Version des Releases (v0.12.7 -> 0.12.7).
          BUILD_NAME_ARG=()
          if [ -n "$RELEASE_TAG" ]; then
            BUILD_NAME_ARG=(--build-name="${RELEASE_TAG#v}")
            echo "Versionsname: ${RELEASE_TAG#v}"
          fi
          for attempt in 1 2 3 4 5; do
            set +e
            flutter build apk --release --build-number="$BUILD_NUMBER" "${BUILD_NAME_ARG[@]}" 2>&1 | tee /tmp/ladecockpit-android-build.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eiq '504|5[0-9]{2}|Gateway Time[- ]out|Gateway Timeout|timed out|Connection reset|UnknownHostException|error while downloading artifacts from the network|Could not GET' /tmp/ladecockpit-android-build.log; then
              echo "Android build failed for a non-transient reason; not retrying."
              exit "$status"
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "Transient Gradle/network error. Retry $((attempt + 1))/5 in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Android build failed after 5 attempts."
          exit 1
      - name: Verify permissions in the compiled APK manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "Android aapt tool not found"
            exit 1
          fi
          echo "Inspecting compiled APK: $APK"
          "$AAPT" dump permissions "$APK" | tee /tmp/ladecockpit-apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/ladecockpit-apk-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/ladecockpit-apk-manifest.txt
          grep -q "networkSecurityConfig" /tmp/ladecockpit-apk-manifest.txt
          echo "Verified INTERNET permission and network security config in compiled APK"
      - name: Verify release signature
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash tool/verify-apk-signature.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Note unsigned test build
        if: steps.signing.outputs.signed != 'true'
        run: |
          echo "::warning::Ohne Release-Schlüssel gebaut: Diese APK trägt den Debug-Schlüssel des Runners und lässt sich nicht als Update über eine installierte App installieren."
          echo "Test-Build mit Debug-Schlüssel – nicht als Update installierbar." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/release-upload.jks
      - uses: actions/upload-artifact@v7
        with:
          name: ladecockpit-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  attach-apk:
    # Hängt die signierte APK an das veröffentlichte Release, damit man sie ohne GitHub-Konto laden kann.
    if: github.event_name == 'release'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ladecockpit-android-apk
      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          FILE="ladecockpit-${TAG#v}.apk"
          mv app-release.apk "$FILE"
          sha256sum "$FILE" | tee "$FILE.sha256"
          gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          echo "APK an Release $TAG angehängt: $FILE" >> "$GITHUB_STEP_SUMMARY"

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter create --platforms=android,ios --org io.github.uekala --project-name ladecockpit .
      - name: Check the iOS bundle identifier
        run: grep -q 'PRODUCT_BUNDLE_IDENTIFIER = io.github.uekala.ladecockpit;' ios/Runner.xcodeproj/project.pbxproj
      - name: Generate branded Android and iOS launcher icons
        working-directory: .
        run: |
          python3 -m venv /tmp/ladecockpit-icon-venv
          /tmp/ladecockpit-icon-venv/bin/python -m pip install --quiet cairosvg
          /tmp/ladecockpit-icon-venv/bin/python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="mobile/assets/ladecockpit_icon.svg",
              write_to="mobile/assets/ladecockpit_icon.png",
              output_width=1024,
              output_height=1024,
          )
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v7
        with:
          name: ladecockpit-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
