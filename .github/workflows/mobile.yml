name: Mobile app builds

on:
  push:
    branches: [main, "feature/mobile-app-ios-android"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name ladecockpit .
      - name: Use Gradle direct download host
        run: sed -i 's#https://services.gradle.org/distributions/#https://downloads.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties
      - name: Add Google-hosted Maven Central mirror to Gradle settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle.kts")
          content = path.read_text()
          marker = "repositories {"
          mirror = '''repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }'''
          if marker not in content:
              raise SystemExit("Gradle settings repositories block not found")
          content = content.replace(marker, mirror)
          path.write_text(content)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK (retry transient Gradle download failures)
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            set +e
            flutter build apk --release 2>&1 | tee /tmp/ladecockpit-android-build.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eiq '504|5[0-9]{2}|Gateway Time[- ]out|Gateway Timeout|timed out|Connection reset|UnknownHostException|error while downloading artifacts from the network|Could not GET' /tmp/ladecockpit-android-build.log; then
              echo "Android build failed for a non-transient reason; not retrying."
              exit "$status"
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "Transient Gradle/network error. Retry $((attempt + 1))/5 in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Android build failed after 5 attempts."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ladecockpit-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name ladecockpit .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ladecockpit-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
