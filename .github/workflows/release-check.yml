name: Release check

# Passt der Tag eines veröffentlichten Releases nicht zur Version im Code, entstehen weder
# Image noch APK. Dann wird das Release wieder zum Entwurf, damit Home Assistant und die
# Handy-App es nicht als Update anbieten.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag against the version in the code
        id: check
        run: python3 tools/check_versions.py
      - name: Turn the release back into a draft
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=true >/dev/null
          {
            echo "### Release ${TAG} ist wieder ein Entwurf"
            echo
            echo "Der Tag passt nicht zur Version im Code (siehe Schritt oben)."
            echo "Version anheben und mergen, dann Entwurf und Tag ${TAG} löschen und das Release neu auf main anlegen."
          } >> "$GITHUB_STEP_SUMMARY"
