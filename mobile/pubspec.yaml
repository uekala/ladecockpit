name: ladecockpit_mobile
description: Mobile companion app for Ladecockpit.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../app/static/icon-512.png
  adaptive_icon_background: "#070B10"
  adaptive_icon_foreground: ../app/static/icon-512.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
